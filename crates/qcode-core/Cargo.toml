[package]
name = "qcode-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
qcode-attachments = { version = "0.10.2", path = "../qcode-attachments" }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ulid.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
async-trait.workspace = true
reqwest.workspace = true
tracing.workspace = true
globset.workspace = true
# `bundled` compiles SQLite from source. `fallible_uint` is what makes `u64`
# `ToSql`/`FromSql` exist at all — `Event.seq` and `last_seq` are `u64`, and the
# two impls moved behind that feature by 0.41 (without it they do not compile).
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
