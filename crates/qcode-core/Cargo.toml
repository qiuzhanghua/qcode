[package]
name = "qcode-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
qcode-attachments = { version = "0.14.1", path = "../qcode-attachments" }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ulid.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
async-trait.workspace = true
reqwest.workspace = true
tracing.workspace = true
globset.workspace = true
# `bundled` compiles SQLite from source. `fallible_uint` is what makes `u64`
# `ToSql`/`FromSql` exist at all — `Event.seq` and `last_seq` are `u64`, and the
# two impls moved behind that feature by 0.41 (without it they do not compile).
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# `LockFileEx` for the schedule-task write lock (ADR-0088 §5) and the
# single-instance lock (ADR-0083), plus named pipes for the single-instance
# activation channel (ADR-0084). Both users are in this crate since ADR-0092
# §11 moved the single-instance module here, out of `qcode-gui`.
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    # 命名管道：单实例的跨进程激活通道（ADR-0084）。
    "Win32_System_Pipes",
    # `DETACHED_PROCESS` / `CREATE_NEW_PROCESS_GROUP`：分离启动 `qcd`
    # （`daemon::spawn`，ADR-0098 把这段从 `qcd` 搬到 core）。
    "Win32_System_Threading",
] }
