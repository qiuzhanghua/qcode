[package]
name = "qcode"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "qc"
path = "src/main.rs"

[dependencies]
qcode-core = { version = "0.5.0", path = "../qcode-core" }
qcode-providers = { version = "0.5.0", path = "../qcode-providers" }
qcode-tools = { version = "0.5.0", path = "../qcode-tools" }
qcode-mcp = { version = "0.5.0", path = "../qcode-mcp" }
qcode-net = { version = "0.5.0", path = "../qcode-net" }
qcode-tui = { version = "0.5.0", path = "../qcode-tui" }
qcode-acp = { version = "0.5.0", path = "../qcode-acp" }
qcode-image = { version = "0.5.0", path = "../qcode-image" }
qcode-kernel = { version = "0.5.0", path = "../qcode-kernel" }
qcode-gui = { version = "0.5.0", path = "../qcode-gui", optional = true }
async-trait.workspace = true
base64.workspace = true
ratatui.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
clap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[build-dependencies]
# Embeds res/icon.rc (the app icon) into the qc.exe on Windows.
embed-resource = "3"

[dev-dependencies]
tempfile.workspace = true
[features]
# Off by default: CLI, TUI and ACP stay lean; the GPU stack only ships in
# the desktop build.
gui = ["dep:qcode-gui"]
