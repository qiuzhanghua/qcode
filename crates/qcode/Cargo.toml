[package]
name = "qcode"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "qc"
path = "src/main.rs"

[dependencies]
qcode-attachments = { version = "0.10.3", path = "../qcode-attachments" }
qcode-core = { version = "0.10.3", path = "../qcode-core" }
qcode-providers = { version = "0.10.3", path = "../qcode-providers" }
qcode-tools = { version = "0.10.3", path = "../qcode-tools" }
qcode-mcp = { version = "0.10.3", path = "../qcode-mcp" }
qcode-net = { version = "0.10.3", path = "../qcode-net" }
qcode-tui = { version = "0.10.3", path = "../qcode-tui" }
qcode-acp = { version = "0.10.3", path = "../qcode-acp" }
qcode-image = { version = "0.10.3", path = "../qcode-image" }
qcode-kernel = { version = "0.10.3", path = "../qcode-kernel" }
qcode-gui = { version = "0.10.3", path = "../qcode-gui" }
async-trait.workspace = true
base64.workspace = true
ratatui.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
clap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
# `qc logs` shows timestamps in local time (ADR-0082). Not a new download: chrono
# is already in the lock file and the cache through the GUI stack.
chrono = "0.4"

[target.'cfg(unix)'.dependencies]
# `kill(pid, 0)` —— 一个唯一用途是回答「那个进程还在吗」（lifecycle 的孤儿判定）。
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  # ADR-0086：判定层要读父进程的映像名（ToolHelp 快照）。
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

# Only build.rs on Windows uses it, so it is gated to Windows too: cargo's
# `unused_dependencies` lint reads a plain `[build-dependencies]` entry as dead
# weight on Linux and macOS, where the `cfg` block in build.rs is compiled out.
[target.'cfg(windows)'.build-dependencies]
# Embeds res/icon.rc (the app icon) into the qc.exe on Windows.
embed-resource = "3"

[dev-dependencies]
tempfile.workspace = true
# 曾经有过 `gui` feature（默认关，另出一份 `qcode-desktop`）。ADR-0086 把它删了：
# 发行物只有一个 `qc`，窗口是它的固有部分，不是可选插件。留着一个「一关就编不过」
# 的空 feature 只会误导人——`--no-default-features` 现在是无操作，照常编出带窗口的
# `qc`。
#
# 裁掉 GPU 栈的办法是**在具体的 crate 上工作**（`-p qcode-kernel` / `-p qcode-tools`
# / `-p qcode-tui`），而不是给整个二进制关开关：那些 crate 本来就不依赖 gpui。
