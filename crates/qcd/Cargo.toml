[package]
name = "qcd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 独立 package 而不是 `crates/qcode` 里的第二个 `[[bin]]`（ADR-0092 §2）。
#
# 这条不是风格问题：依赖是按 **package** 算的，不是按 bin。在 `crates/qcode`
# 里加一个 `[[bin]] name = "qcd"`，它会和 `qc` 共用同一份依赖表，于是把
# `qcode-gui` → gpui → wgpu/winit 全部链接进一个本该没有界面的常驻进程。
# 那正是 ADR-0092 §2 要避免的东西，而且**不会报错**——只会在发布物体积上体现。
#
# 所以这里的依赖面刻意只有 kernel（引擎）与 driver（决策 + 一拍）：
# 没有 qcode-gui、没有 qcode-tui、没有 qcode-terminal。
[dependencies]
qcode-core = { version = "0.16.0", path = "../qcode-core" }
qcode-driver = { version = "0.16.0", path = "../qcode-driver" }
qcode-kernel = { version = "0.16.0", path = "../qcode-kernel" }
# 界面语言（ADR-0105）。daemon 跑定时任务时工具结果的文案跟着 `[ui] language`，
# 见 `qcode_i18n::init_for_daemon`。
qcode-i18n = { version = "0.16.0", path = "../qcode-i18n" }
qcode-tools = { version = "0.16.0", path = "../qcode-tools" }
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
time.workspace = true

[target.'cfg(unix)'.dependencies]
# `setsid`：让孩子成为新会话的首进程（ADR-0092 §11 阶段 3）。
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# `DETACHED_PROCESS` / `CREATE_NEW_PROCESS_GROUP`（ADR-0092 §11 阶段 3）。
# 与 `qcode-core` 用同一个大版本，避免同一 crate 编两遍。
windows-sys = { version = "0.60", features = [
    "Win32_System_Threading",
] }

[dev-dependencies]
qcode-providers = { version = "0.16.0", path = "../qcode-providers" }
tempfile.workspace = true
