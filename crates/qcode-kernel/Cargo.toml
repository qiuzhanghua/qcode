[package]
name = "qcode-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
qcode-core = { version = "0.10.0", path = "../qcode-core" }
qcode-mcp = { version = "0.10.0", path = "../qcode-mcp" }
qcode-tools = { version = "0.10.0", path = "../qcode-tools" }
qcode-net = { version = "0.10.0", path = "../qcode-net" }
reqwest.workspace = true
serde_json.workspace = true
qcode-providers = { version = "0.10.0", path = "../qcode-providers" }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
toml.workspace = true
toml_edit = "0.22"
# `spawn_blocking` for the shell environment sample (ADR-0070). `assemble` is
# awaited on the GUI's UI executor, so blocking that thread for a shell startup
# would freeze the window; the sample has to go to a blocking thread.
tokio.workspace = true

# Test-only stdio MCP server for the grant/sandbox tests (ADR-0066); the
# integration test spawns it via CARGO_BIN_EXE_mcp-probe-stub.
[[bin]]
name = "mcp-probe-stub"
path = "tests/support/mcp_probe_stub.rs"

# Test-only Streamable HTTP server for the egress test (ADR-0067 §2). The file
# itself lives in `qcode-mcp`; see the shim's comment.
[[bin]]
# A distinct name from `qcode-mcp`'s copy: two packages in one workspace cannot
# share an output filename, and Cargo warns that it will become an error.
name = "mcp-http-probe"
path = "tests/support/http_probe_server.rs"

[dev-dependencies]
tempfile.workspace = true
