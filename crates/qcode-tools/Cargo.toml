[package]
name = "qcode-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
qcode-shell = { version = "0.8.9", path = "../qcode-shell" }
qcode-core = { version = "0.8.9", path = "../qcode-core" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
globset.workspace = true
ignore.workspace = true
regex.workspace = true
similar.workspace = true
reqwest.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
qcode-net = { version = "0.8.9", path = "../qcode-net" }
qcode-providers = { version = "0.8.9", path = "../qcode-providers" }
tempfile.workspace = true
time.workspace = true
tokio-util.workspace = true

# A real `main`, so the binary can be re-executed as the macOS/Linux guard
# process (`__qcode-procguard <pid>`) the way `qc` itself is. A libtest harness
# would treat that argument as an unknown flag and never reach the dispatch.
# See ADR-0074 and the file's own docs.
[[test]]
name = "procguard"
path = "tests/procguard.rs"
harness = false
