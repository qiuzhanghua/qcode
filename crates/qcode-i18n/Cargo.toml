[package]
name = "qcode-i18n"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 唯一调用 `rust_i18n::i18n!` 的 crate（ADR-0105 §8）。`t!` 在 4.x 展开成
# `crate::_rust_i18n_t!`，绑定**调用方** crate，所以翻译表无法跨 crate 共享；
# 于是这张表放在这里，其余 crate 通过 `tr()` / `trf()` 取值。
#
# 必须与 gpui-component 用同一份 rust-i18n（它要求 "4.2.0"）。写 `"3"` 会链入
# 两个 `CURRENT_LOCALE`，语言静默分叉——见 ADR-0105 决定 1。
[dependencies]
rust-i18n = "4.2"
# 语言来源：`QCODE_LANG` 之外还要读系统首选语言，否则中文 macOS 与全部 Windows
# 用户永远拿英文（ADR-0105 决定 2）。0.3.2 已经在 lock 里（经 gpui-base），
# 这条只是把它升为直接依赖，不新增任何 crate。
sys-locale = "0.3"

[dev-dependencies]
# 门禁 1（key 集合相等）要读 `locales/app.yml`。用 rust-i18n 自己那份 YAML 解析器，
# 它已经在 lock 里（`rust-i18n-support` 的依赖），所以这里不新增任何 crate。
serde-saphyr = "1.3"
serde_json = { workspace = true }

[package.metadata.i18n]
available-locales = ["en", "zh-CN"]
default-locale = "en"
load-path = "locales"
