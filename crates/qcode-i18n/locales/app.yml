_version: 2

# 唯一一份翻译表（ADR-0105 §8）。key 是结构化路径，**不是英文原文**——
# 英文原文改一次，用原文当 key 的表就全表失配（I18N.md §5.2）。
#
# 语言只有 en 与 zh-CN。繁体（zh-Hant / zh-TW / zh-HK）在 `normalize` 里
# 归到 zh-CN（I18N.md §4.4）。
#
# 插值统一 `%{name}`（rust-i18n 语法），不要用 `{}`——那是 `format!` 的。
#
# P0 只落「程序名」与「错误前缀」两条，用来证明整条链路通。P1 起按
# gui. / cli. / tui. / tool. / cfg. / ui. / err. 命名空间分批填入。

app:
  name:
    en: qcode
    zh-CN: qcode
  # `main` 返回 `anyhow::Result` 时 stderr 的前缀由 std 运行时打印，不是我们的代码，
  # 因此这条只用于我们自己拼错误行的地方。
  error_prefix:
    en: "Error: "
    zh-CN: "错误："
  # 时长的**文字**部分。选哪一条由 Rust 决定（见
  # `render::transcript::format_elapsed`），翻译层只负责把分量拼成句子。
  #
  # 英文用 `1m 23s`（单位间有空格）：cargo / GitHub Actions / Vercel 都是这个写法。
  # 中文用 `1分23秒`，与英文**结构平行**（同样紧凑），两边宽度接近，实时计数器跨
  # 单位时的跳动幅度也就一致。
  #
  # 不用 `1:23` 表盘式：`1:23` 本身歧义（1 分 23 秒，还是 1 时 23 分？），而与工具
  # 耗时的 `m/s` 形态并存时，又会重新变成「一个界面里两种写法」。
  #
  # 每个量级都把该有的分量写全，不做零分量省略：这一行每秒重算，秒数始终显示（含
  # `1m 0s`）——末尾跳动的数字就是「还在跑」的证据，省成 `1m` 反而看不出死活；
  # 满一小时也照写 `1h 0m 0s`，否则边界上会出现 `59m 59s` → `1h 0s` → `1h 0m 1s`
  # 这种先掉一个分量再涨回来的抖动。
  duration:
    seconds:
      en: "%{0}s"
      zh-CN: "%{0}秒"
    minutes_seconds:
      en: "%{0}m %{1}s"
      zh-CN: "%{0}分%{1}秒"
    hours_minutes_seconds:
      en: "%{0}h %{1}m %{2}s"
      zh-CN: "%{0}小时%{1}分%{2}秒"
  # 时长出现处的**整句**。标签与数值分开翻会拼出「Took1m 23s」这种缺空格的怪句，
  # 所以整句入 key，由 `%{0}` 承接已经格式化好的时长。
  elapsed:
    running:
      en: "Working · %{0} ···"
      zh-CN: 工作中，用时 %{0} ···
    running_plain:
      en: Working
      zh-CN: 工作中
    took:
      en: "Took %{0}"
      zh-CN: 耗时 %{0}
    process_steps:
      en: "Steps · %{0}"
      zh-CN: 执行过程 · %{0} 项

# 跨界面复用的**动作与字段名**。放在 `ui.` 而不是各页面各写一份：同一个「取消」
# 在这个仓库里出现了五次，五份中文看着一样、英文迟早会分叉成 Cancel / Dismiss /
# Abort。字段名同时兼作无障碍标签（`aria_label`），所以也只能有一份。
ui:
  action:
    cancel:
      en: Cancel
      zh-CN: 取消
    save:
      en: Save
      zh-CN: 保存
    delete:
      en: Delete
      zh-CN: 删除
    edit:
      en: Edit
      zh-CN: 编辑
    saved:
      en: Saved
      zh-CN: 已保存
    set_default:
      en: Set as default
      zh-CN: 设为默认
    add_model:
      en: + Add model
      zh-CN: ＋ 添加模型
  field:
    display_name:
      en: Display name
      zh-CN: 显示名称
    api_base:
      en: API endpoint
      zh-CN: API 地址
    api_key:
      en: API key
      zh-CN: API 密钥
    model_id:
      en: Model ID
      zh-CN: 模型 ID
    context_window:
      en: Context window
      zh-CN: 上下文窗口
    max_tokens:
      en: Max output tokens
      zh-CN: 最大输出 token
    search_model:
      en: Search models
      zh-CN: 搜索模型
  # 暂停卡片与预算提示的行。**跨 crate 共享**：`qcode-ui-state` 与 `qcode-gui`
  # 都在拼这些行，而它们是同一条信息，两种写法迟早对不上。
  progress:
    files_changed:
      en: "Changed %{0} files (+%{1} −%{2})"
      zh-CN: "修改了 %{0} 个文件（+%{1} −%{2}）"
    # 一次操作涉及多个文件时的计数短语（不是句子）。
    file_count:
      en: "%{0} files"
      zh-CN: "%{0} 个文件"
  pause:
    turns_used:
      en: "%{0}/%{1} turns used"
      zh-CN: "已用 %{0}/%{1} 轮"
    cost_ceiling:
      en: "Cost reached 95% of the $%{0} budget ($%{1} used)"
      zh-CN: "成本已达预算 $%{0} 的 95%（已用 $%{1}）"
    window:
      en: "budget window %{0}"
      zh-CN: "第 %{0} 个预算窗口"
    # 引擎给的「继续」不是用户打的字，读成一条通知而不是提问。
    resume_notice:
      en: Continuing the paused task
      zh-CN: 继续上一次暂停的任务

# 配置页（`setup/`）。key 按 `gui.setup.<区域>.<元素>` 分层。
#
# 这里的中文一律**保持原文**：这一批只做「把文案搬进表」，不顺手改中文措辞，
# 否则一次提交里混着「翻译」和「改稿」，中文界面变了却没人能一眼看出为什么。
gui:
  # 主区（`render/main.rs`）：状态栏、审批/提问面板、预算提示、覆盖层。
  main:
    # 模型下拉里的一行：`使用「provider」（model）`。
    use_model:
      en: "Use \"%{0}\" (%{1})"
      zh-CN: "使用「%{0}」（%{1}）"
    # 状态栏的沙箱读写状态（对任务下全部目录统一生效，所以只有两态）。
    sandbox_write:
      en: Workspace writable
      zh-CN: 工作区可写
    sandbox_read_only:
      en: Read-only
      zh-CN: 仅可读取
    sandbox_menu_tip:
      en: Sandbox directory permissions (apply to every directory of this task)
      zh-CN: 沙箱目录权限（对当前任务全部目录生效）
    # 状态栏的沙箱后端摘要：`无沙箱` / `<backend> 沙箱`。
    sandbox_none:
      en: No sandbox
      zh-CN: 无沙箱
    sandbox_backend:
      en: "%{0} sandbox"
      zh-CN: "%{0} 沙箱"
    push:
      en: Push
      zh-CN: 推送
    answer_placeholder:
      en: Type an answer…
      zh-CN: 输入回答…
    # 覆盖层标题与按钮。
    command_output:
      en: Command output
      zh-CN: 命令输出
    diff:
      en: Changes
      zh-CN: 改动
    close:
      en: Close
      zh-CN: 关闭
    upload:
      en: Choose file
      zh-CN: 选择文件
    # 预算接近上限的提示卡。
    budget_title:
      en: Budget almost used up
      zh-CN: 预算接近上限
    budget_body_more:
      en: Continuing will spend more budget; for more room, raise [agent] max_turns / max_cost_usd, or start a new task.
      zh-CN: 继续跑会消耗更多预算；需要更多空间可以调大 [agent] max_turns / max_cost_usd，或者在新任务里重开。
    budget_body_pauses:
      en: When the budget runs out this turn pauses rather than failing — you can continue, wrap up, or leave it.
      zh-CN: 预算用完时这一轮会「暂停」而不是报错：可以直接继续、收尾，或者先这样。
    new_task:
      en: New task
      zh-CN: 新建任务
    ignore:
      en: Ignore
      zh-CN: 忽略
    submitted:
      en: Submitted, waiting for the engine to confirm…
      zh-CN: 已提交，等待引擎确认…
    # 审批面板。
    approval:
      title:
        en: Waiting for approval
        zh-CN: 等待审批
      # 这是全仓库最需要说清的一句话：它同时回答「要什么权限」「为什么被拦」
      # 「影响哪里」「会不会改文件」。四件事缺一件，用户就只能在「允许」和
      # 「拒绝」之间猜。
      explain:
        en: "Allow %{0} permission for this call? While running %{1} it was stopped by %{2}, so it cannot write in %{3}. It needs elevated permission; this call changes no file contents or ownership."
        zh-CN: "是否允许本次操作使用%{0}权限：执行%{1}时，被%{2}拦截，无法在%{3}目录上执行写入，需要提升操作权限；此次操作不会改动任何文件的内容和所有者。"
      escalate:
        en: "Requesting elevation to %{0}: %{1}"
        zh-CN: "请求提权到 %{0}：%{1}"
      no_reason:
        en: (no reason given)
        zh-CN: （未说明理由）
      allow:
        en: Allow
        zh-CN: 允许
      allow_always:
        en: Always allow
        zh-CN: 总是允许
      deny:
        en: Deny
        zh-CN: 拒绝
      # 工具类别：审批面板第一句里的「什么权限」。
      kind_shell:
        en: command execution
        zh-CN: 执行命令
      kind_files:
        en: file read/write
        zh-CN: 读写文件
      # 拦截原因。这些是**把引擎的英文 reason 映射成一句人话**，所以查表与
      # 译文必须一起动：`reason` 匹配的是英文关键字（见 `render/main.rs`）。
      reason_process:
        en: the process-execution policy
        zh-CN: 进程执行策略
      reason_sandbox_escalation:
        en: the sandbox-escalation policy
        zh-CN: 沙箱提权策略
      reason_outside_workspace:
        en: the write-outside-workspace policy
        zh-CN: 工作区外写入策略
      reason_multi_file:
        en: the multi-file-write policy
        zh-CN: 多文件写入策略
      reason_external_tool:
        en: the external-tool policy
        zh-CN: 外部工具策略
      reason_network:
        en: the network-access policy
        zh-CN: 网络访问策略
      reason_rule:
        en: a permission rule
        zh-CN: 权限规则
      current_dir:
        en: the current directory
        zh-CN: 当前目录
    # 提问面板。
    question:
      title:
        en: Question
        zh-CN: 提问
      progress:
        en: "Question %{0} of %{1}"
        zh-CN: 第 %{0} 题，共 %{1} 题
      pick_dir:
        en: Choose directory
        zh-CN: 选择目录
      back:
        en: Previous
        zh-CN: 上一题
      skip:
        en: Skip
        zh-CN: 跳过
      submit:
        en: Submit
        zh-CN: 提交
      next:
        en: Next
        zh-CN: 下一题
    error_banner:
      en: Request failed · full details
      zh-CN: 请求报错 · 完整信息
  # 侧栏（`render/sidebar.rs`）：产品名、两个段、任务行菜单、目录编辑、图标轨。
  sidebar:
    # 产品标识（ADR-0063 §2 定的临时名 `AI 工具`）。
    #
    # **这一条与厂商名不同，是按界面语言翻的**：`AI 工具` 是普通词（"AI tools"），
    # 不是商标；英文界面里留着四个汉字读起来像 bug。等 ADR-0063 说的「正式名」落地
    # 时，把两边的值写成同一个（或退回一个 `const`）即可 —— 那时它才成为真正的
    # 产品名，按 kernel 厂商名的规矩不翻。
    product_name:
      en: AI tools
      zh-CN: AI 工具
    # 两段手风琴的段头。
    section:
      tasks:
        en: My tasks
        zh-CN: 我的任务
      schedule:
        en: Scheduled tasks
        zh-CN: 定时任务
      new_task:
        en: New task
        zh-CN: 新建任务
      terminal:
        en: Terminal
        zh-CN: 终端
      settings_tooltip:
        en: Settings (opens in a new window)
        zh-CN: 设置（在新窗口中打开）
      settings_aria:
        en: Settings, opens in a new window
        zh-CN: 设置，在新窗口中打开
    # 任务行的 ⋯ 菜单与提示。
    menu:
      actions:
        en: Task actions
        zh-CN: 任务操作
      stop:
        en: Stop
        zh-CN: 停止
      stop_tip_running:
        en: Stop this task (the others keep running)
        zh-CN: 停止这个任务（不影响其它任务）
      stop_tip_idle:
        en: This task is not running
        zh-CN: 这个任务没有在跑
      rename:
        en: Rename
        zh-CN: 重命名
      rename_tip_running:
        en: A rename applies once the turn finishes
        zh-CN: 运行中改名将在 Turn 结束后生效
      rename_tip:
        en: Rename task
        zh-CN: 重命名任务
      delete:
        en: Delete task
        zh-CN: 删除任务
      delete_tip_running:
        en: Deletable once the current turn finishes
        zh-CN: 结束当前 Turn 后可删除
      add_dir:
        en: Add directory
        zh-CN: 添加目录
    # 任务行尾的状态尾巴（前导 ` · ` 在 key 里，因为它跟标题拼在一起）。
    row:
      missing_root:
        en: " · directory lost"
        zh-CN: " · 目录丢失"
      waiting_approval:
        en: " · waiting for approval"
        zh-CN: " · 待审批"
    # 目录编辑器的三个按钮与状态。
    root:
      missing:
        en: Lost
        zh-CN: 丢失
      set_primary:
        en: Set as primary
        zh-CN: 设为主目录
      relink:
        en: Relink directory
        zh-CN: 重新关联目录
      remove:
        en: Remove directory
        zh-CN: 移除目录
      pending:
        en: Applied after the current turn
        zh-CN: 当前 Turn 结束后应用
    # 图标轨（折叠态）。
    rail:
      expand:
        en: Expand sidebar
        zh-CN: 展开侧栏
      collapse:
        en: Collapse sidebar
        zh-CN: 折叠侧栏
      tasks:
        en: Tasks
        zh-CN: 任务
      schedule:
        en: Scheduled
        zh-CN: 定时
    # 定时任务段。
    schedule:
      filter:
        en: Filter scheduled tasks
        zh-CN: 定时任务筛选
      filter_by_status:
        en: Filter by status
        zh-CN: 按状态过滤
      all:
        en: All
        zh-CN: 全部
      status_active:
        en: Active
        zh-CN: 已开启
      status_paused:
        en: Paused
        zh-CN: 已暂停
      status_ended:
        en: Ended
        zh-CN: 已结束
      empty:
        en: No scheduled tasks yet — ask the model in the chat to create one
        zh-CN: 还没有定时任务——直接在对话里让模型创建即可
      empty_filtered:
        en: "No scheduled tasks in \"%{0}\""
        zh-CN: "没有「%{0}」状态的定时任务"
      driver_aria:
        en: "Scheduled-task resident driver: %{0}"
        zh-CN: "定时任务常驻驱动：%{0}"
  # 对话流（`render/transcript.rs`）。
  transcript:
    # 工具名 → 动词。**只是动词**：标识符（`run_shell`）不翻，见 `tool_label`。
    verb:
      shell:
        en: Run command
        zh-CN: 运行命令
      list_dir:
        en: List directory
        zh-CN: 列出目录
      glob:
        en: Find files
        zh-CN: 查找文件
      search:
        en: Search
        zh-CN: 搜索
      read:
        en: Read file
        zh-CN: 读取文件
      write:
        en: Write file
        zh-CN: 写入文件
      edit:
        en: Edit file
        zh-CN: 修改文件
      todo:
        en: Update todo list
        zh-CN: 更新待办
      subagent:
        en: Sub-agent
        zh-CN: 子代理
    queued:
      en: Queued
      zh-CN: 排队中
    thinking:
      en: Thinking
      zh-CN: 思考
    copied:
      en: Copied
      zh-CN: 已复制
    copy:
      en: Copy
      zh-CN: 复制
    copy_turn:
      en: Whole turn
      zh-CN: 整轮
    view_diff:
      en: View
      zh-CN: 查看
    # 定时投递的消息：说明它不是你刚打的字。
    scheduled:
      en: "⏱ Scheduled · %{0}"
      zh-CN: "⏱ 定时任务 · %{0}"
    paused:
      en: "⏸ Paused · %{0}"
      zh-CN: "⏸ 已暂停 · %{0}"
    # 「这一轮干了什么」的一句话摘要。
    did:
      writes:
        en: changed files
        zh-CN: 修改了文件
      shells:
        en: ran commands
        zh-CN: 执行了命令
      reads:
        en: read files
        zh-CN: 已读取文件
      separator:
        en: ", "
        zh-CN: "，"
    # 暂停卡片的三个出口。三个都要短：并排放在一张卡片里。
    resume:
      en: Continue
      zh-CN: 继续
    wrap_up:
      en: Wrap up
      zh-CN: 收尾
    dismiss:
      en: Leave it for now
      zh-CN: 先这样
    image_unavailable:
      en: "[image no longer available]"
      zh-CN: "[图片已不可用]"
  # 任务管理（`shell/tasks.rs`）：新建、重命名、目录、删除。
  task:
    new_title:
      en: New task
      zh-CN: 新任务
    title_placeholder:
      en: Task title
      zh-CN: 任务标题
    title_required:
      en: The task title cannot be empty
      zh-CN: 任务标题不能为空
    renamed:
      en: Task renamed
      zh-CN: 任务已重命名
    rename_pending:
      en: Renamed once this task's turn finishes
      zh-CN: 该任务的 Turn 结束后重命名
    rename_failed:
      en: "Could not rename the task: %{0}"
      zh-CN: "无法重命名任务: %{0}"
    delete_running:
      en: Stop this task before deleting it
      zh-CN: 请先停止该任务，再删除正在运行的任务
    delete_failed:
      en: "Could not delete the task: %{0}"
      zh-CN: "无法删除任务: %{0}"
    deleted:
      en: Task deleted
      zh-CN: 任务已删除
    roots_updated_failed:
      en: "Could not update the directories: %{0}"
      zh-CN: "无法更新目录: %{0}"
    roots_applying:
      en: Applying the pending directory change
      zh-CN: 正在应用待处理的目录变更
    roots_pending:
      en: The directory change is applied once this task's turn finishes
      zh-CN: 目录变更将在该任务的 Turn 结束后应用
    root_exists:
      en: "That directory is already there: %{0}"
      zh-CN: "目录已存在: %{0}"
  # 定时任务在 GUI 里的操作回执与拒绝理由（`runtime.rs`、`backend.rs`）。
  schedule:
    # 驱动锁易主/被占时的两条提示。原文硬编码中文，英文用户会看到中文。
    notice_took_over:
      en: >-
        This window now drives the scheduled tasks (the process holding the
        driver lock exited). Closing the window stops them — to keep them
        running, use `qc daemon start`.
      zh-CN: >-
        定时任务改由这个窗口驱动（之前持有驱动锁的进程已退出）。
        关掉窗口就会停——要让它一直跑，用 `qc daemon start`。
    notice_other_driver:
      en: >-
        Another process drives the scheduled tasks (it holds the driver lock),
        so this window will not fire them. To see who is running, use
        `qc schedule list`.
      zh-CN: >-
        定时任务由另一个进程驱动（它持有驱动锁），这个窗口不重复触发。
        要确认谁在跑，用 `qc schedule list`。
    hint:
      broken:
        en: "The schedule is misconfigured: %{0}"
        zh-CN: "定时配置有误: %{0}"
      orphaned:
        en: The schedule is dead (its target session was deleted)
        zh-CN: 定时已失效（目标会话已删除）
      missed:
        en: "%{0} scheduled deliveries were missed"
        zh-CN: 定时错过 %{0} 次
    # 「立即执行」的准入闸。命中即拒，任务状态零变更。
    reject:
      busy:
        en: This task is already running; wait for its turn to finish
        zh-CN: 该任务正在执行中，请等待其回合结束再执行
      too_frequent:
        en: "Delivered too often: two deliveries are at least 60 seconds apart"
        zh-CN: 投递过于频繁：两次投递至少间隔 60 秒
    no_driver_lock:
      en: "Cannot take the driver lock, so this window will not trigger scheduled tasks (see the log: qc logs)."
      zh-CN: 拿不到驱动锁，这个窗口不会触发定时任务（详见日志 qc logs）。
    op:
      created:
        en: "Created scheduled task `%{0}`"
        zh-CN: "已创建定时任务 `%{0}`"
      listed:
        en: "%{0} scheduled tasks"
        zh-CN: 共 %{0} 个定时任务
      not_found:
        en: That scheduled task does not exist
        zh-CN: 定时任务不存在
      paused:
        en: Paused
        zh-CN: 已暂停
      resumed:
        en: Resumed
        zh-CN: 已恢复
      ran:
        en: Triggered
        zh-CN: 已触发
      deleted:
        en: Deleted
        zh-CN: 已删除
  runtime:
    switch_provider_failed:
      en: "Could not switch to %{0}: %{1}"
      zh-CN: 无法切换到 %{0}：%{1}
  # 右侧回合导航栏（`render/rail.rs`）。
  rail:
    turn:
      en: "Turn %{0}"
      zh-CN: "第 %{0} 轮"
    answering:
      en: (answering…)
      zh-CN: （回答中…）
    no_answer:
      en: (no answer yet)
      zh-CN: （暂无回答）
    jump_to_bottom:
      en: Jump to the bottom
      zh-CN: 跳转到底部
  # 窗口级通知（状态栏一行）。`shell/` 与 `runtime.rs` 都在用。
  notice:
    stopping_all:
      en: Stopping the running tasks…
      zh-CN: 正在停止正在运行的任务…
    stopping_task:
      en: "Stopping %{0}"
      zh-CN: 正在停止 %{0}
    settings_pending_all_idle:
      en: "Settings saved: applied once every task is idle"
      zh-CN: 设置已保存：等所有任务空闲后应用
    settings_pending_after_turn:
      en: Settings saved; they take effect after the current task finishes
      zh-CN: 设置已保存，将在当前任务结束后生效
    settings_no_reload:
      en: Settings saved, but this backend cannot reload
      zh-CN: 设置已保存，但此后端不支持重新加载
    model_search_placeholder:
      en: Search models…
      zh-CN: 搜索模型…
    not_configured:
      en: "Not configured yet: open Settings"
      zh-CN: 还没有配置：先打开「设置」
    schedule_incomplete_rule:
      en: "The period is incomplete or invalid: check the period selection"
      zh-CN: 周期不完整或无效：请检查周期选择
    cannot_list_tasks:
      en: "cannot list tasks: %{0}"
      zh-CN: "列不出任务：%{0}"
    cannot_restore_session:
      en: "cannot restore last session: %{0}"
      zh-CN: "恢复不了上次的会话：%{0}"
    # `gui.json` 是文件名，不翻；`%{0}` 是下层错误串（运行期事实）。
    cannot_save_gui_json:
      en: "cannot save gui.json: %{0}"
      zh-CN: "存不下 gui.json：%{0}"
    applying_settings:
      en: "applying settings…"
      zh-CN: 正在应用设置…
    settings_applied:
      en: "settings applied"
      zh-CN: 设置已应用
    settings_no_provider:
      en: "settings saved, but the config has no usable provider; open Settings to add one"
      zh-CN: "设置已保存，但配置里没有可用的供应商；打开设置添加一个"
    cannot_reattach:
      en: "cannot re-attach session: %{0}"
      zh-CN: "重新接不上会话：%{0}"
    new_session:
      en: "new session"
      zh-CN: 新会话
    cannot_resume:
      en: "cannot resume %{0}: %{1}"
      zh-CN: "接不上 %{0}：%{1}"
    resumed:
      en: "resumed %{0}"
      zh-CN: "已接上 %{0}"
    cannot_refresh_tasks:
      en: "cannot refresh tasks: %{0}"
      zh-CN: "刷新不了任务：%{0}"
  # 新建 / 切换任务时的提示（`shell/session.rs`）。
  session:
    no_provider:
      en: No provider is configured yet; set one up in Settings, then create a task
      zh-CN: 还没有配置 provider，先在 Settings 里配置再新建任务
    draft_unsent:
      en: "This draft has not been sent yet: send it, or clear it before creating another task"
      zh-CN: 这份草稿还没发出去：发送它，或清空后再新建任务
    empty_task:
      en: This task has no content yet; just ask
      zh-CN: 当前任务还没有内容，直接提问即可
    resumed_unsent:
      en: Continuing the unsent new task
      zh-CN: 继续未发送的新任务
    draft_parked:
      en: The unsent new task was parked; press + to return to it
      zh-CN: 未发送的新任务已暂存，按 + 回到它
  # 托盘菜单。三个平台各写一份同样的三个条目 —— 只留一条 key，否则三种平台
  # 的菜单文案迟早不一样。
  tray:
    show_window:
      en: Show window
      zh-CN: 显示主窗口
    stop_current:
      en: Stop the current task
      zh-CN: 停止当前任务
    quit:
      en: Quit
      zh-CN: 退出
    # 菜单顶部那一行（disabled）：一眼看出「现在在干什么」。
    status_approval:
      en: QCode · waiting for approval (%{0})
      zh-CN: QCode · 等待审批（%{0}）
    status_running:
      en: QCode · running
      zh-CN: QCode · 运行中
    status_idle:
      en: QCode · idle
      zh-CN: QCode · 空闲
  terminal:
    title:
      en: Terminal
      zh-CN: 终端
    empty:
      en: No terminals yet
      zh-CN: 还没有终端
    new:
      en: New terminal
      zh-CN: 新建终端
    too_many:
      en: "At most %{0} terminals; close one before opening another"
      zh-CN: 最多 %{0} 个终端；先关掉一个再开新的
    start_failed:
      en: "Could not start the terminal (%{0}): %{1}"
      zh-CN: 终端启动失败（%{0}）：%{1}
  # 输入框右下角的发送提示。键名不翻（`Enter`、`Shift+Enter` 要照着按）。
  composer:
    # 输入框的无障碍名（屏幕阅读器会读它，不显示在界面上）。
    message_qcode:
      en: "Message qcode"
      zh-CN: "给 qcode 发消息"
    send_enter:
      en: Enter sends · Shift+Enter for a new line
      zh-CN: Enter 发送 · Shift+Enter 换行
    send_cmd_enter:
      en: Cmd+Enter sends · Enter for a new line
      zh-CN: Cmd+Enter 发送 · Enter 换行
    send_ctrl_enter:
      en: Ctrl+Enter sends · Enter for a new line
      zh-CN: Ctrl+Enter 发送 · Enter 换行
  attachment:
    bad_image:
      en: "%{0}: not a supported image format (png / jpeg / webp / gif)"
      zh-CN: "%{0}: 不是支持的图片格式（png / jpeg / webp / gif）"

  setup:
    # 凭证状态。三个词是仪器读数，不是句子：卡片副标题里与协议名并排（`OpenAI
    # 兼容 · 凭证缺失`），所以尽量短。
    credential:
      configured:
        en: key configured
        zh-CN: 凭证已配置
      missing:
        en: key missing
        zh-CN: 凭证缺失
      keyless:
        en: no key needed
        zh-CN: 无需密钥
    # Provider 卡片列表。
    card:
      add_provider:
        en: + Add model / provider
        zh-CN: ＋ 添加模型/供应商
      empty:
        en: No provider has models configured yet. Click "+ Add model / provider" to pick one and set it up.
        zh-CN: 还没有配置模型的 Provider。点击「＋ 添加模型/供应商」选择 Provider 并配置。
      collapse:
        en: Collapse ▾
        zh-CN: 收起 ▾
      expand:
        en: Expand ▸
        zh-CN: 展开 ▸
      # 卡片副标题里的模型能力摘要。`-` 表示未知，由调用方决定。
      caps:
        en: Context %{0} · max output %{1}
        zh-CN: 上下文 %{0} · 最大输出 %{1}
      no_models:
        en: This provider has no models yet. Use the button above to add one.
        zh-CN: 该 Provider 尚无模型，点击上方按钮添加。
      configure_model:
        en: + Configure model
        zh-CN: ＋ 配置模型
      custom_provider:
        en: Custom provider…
        zh-CN: 自定义提供方…
    # 「添加模型」对话框与编辑面板共用的两个标题。
    editor:
      add_model_title:
        en: Add a model to %{0}
        zh-CN: 为 %{0} 添加模型
      edit_title:
        en: Edit %{0}
        zh-CN: 编辑 %{0}
      choose_provider:
        en: Choose a provider
        zh-CN: 选择 Provider
      # 密钥输入框下的说明：这是全仓库唯一一处解释「密钥写到哪」的地方。
      api_key_hint:
        en: API key (stored in the system keychain, never written to config.toml)
        zh-CN: API 密钥（存入系统钥匙串，不写入 config.toml）
      store_keychain:
        en: Store in keychain
        zh-CN: 存入钥匙串
      collapse_config:
        en: Collapse settings ▴
        zh-CN: 收起配置 ▴
      expand_config:
        en: More settings ▾
        zh-CN: 展开更多配置 ▾
      saved:
        en: Saved %{0}.
        zh-CN: 已保存 %{0}。
      # 同一 provider 既可能被全局默认覆盖，也可能自己就是那个默认。
      global_override:
        en: Overridden by the global default "%{0}"; saving here makes this the one that counts.
        zh-CN: 被全局默认「%{0}」覆盖；保存后以这里为准
    # 模型目录（一个 provider 的模型清单）。
    catalog:
      custom:
        en: Custom model list in use
        zh-CN: 已自定义模型目录
      adapter_default:
        en: Using the adapter's default models
        zh-CN: 正在使用适配器默认模型
      title:
        en: Model list
        zh-CN: 模型目录
      restore:
        en: Restore default models
        zh-CN: 恢复默认模型
      fetch:
        en: Fetch available models
        zh-CN: 获取可用模型
      empty_warning:
        en: The model picker will show no models at all; IDs outside the list can still be sent.
        zh-CN: 模型选择器中将不显示任何模型；目录外 ID 仍可直接发送。
      # 全角冒号是中文排版的一部分，英文要半角加空格。这类只有标点不同的条目
      # 最容易被漏 —— 「看起来没中文」但照样是中文标点。
      custom_ids:
        en: "%{0}: %{1}"
        zh-CN: "%{0}：%{1}"
    # 自定义提供方表单。
    custom:
      title:
        en: Add a custom provider
        zh-CN: 添加自定义提供方
      protocol:
        en: API protocol
        zh-CN: API 协议
      create:
        en: Create provider
        zh-CN: 创建提供方
    # 从远端拉回的模型里勾选。
    picker:
      title:
        en: Choose models to add
        zh-CN: 选择要添加的模型
      hint:
        en: These are the provider's available models. Tick the ones to add.
        zh-CN: 以下是模型提供方的可用模型，勾选要添加的模型。
      select_all:
        en: Select all
        zh-CN: 全选
      clear_all:
        en: Clear all
        zh-CN: 取消全选
      add_selected:
        en: Add selected
        zh-CN: 添加所选
    delete:
      title:
        en: Delete %{0}?
        zh-CN: 删除 %{0}？
      # 说清「删配置不删钥匙串」：这是用户最容易误解、也最容易造成「我删了密钥
      # 却还在」困惑的一点。
      body:
        en: Deleting %{0} removes its configuration. Keys already stored in the system keychain are kept.
        zh-CN: 删除 %{0} 会移除其配置；已存入系统钥匙串的密钥不会被移除。
    notice:
      default_with_model:
        en: Set %{0} / %{1} as the default.
        zh-CN: 已设 %{0} / %{1} 为默认。
      default_provider:
        en: Set %{0} as the default provider.
        zh-CN: 已设 %{0} 为默认提供方。
      key_restored:
        en: Restored %{0}'s key command from the system keychain.
        zh-CN: 已从系统钥匙串恢复 %{0} 的密钥读取命令
      created:
        en: Created %{0}.
        zh-CN: 已创建 %{0}。
    error:
      id_invalid:
        en: A provider ID must start with a lowercase letter, and may then use lowercase letters, digits and dashes.
        zh-CN: Provider ID 需以小写字母开头，之后可用小写字母、数字和短横线。
      id_taken:
        en: Another provider already uses this ID.
        zh-CN: 已有提供方使用了这个 ID。
      base_required:
        en: A custom provider needs an API endpoint.
        zh-CN: 自定义提供方需要填写 API 地址。
    # ---- 向导模式与设置窗口外壳（`setup/render.rs`）----
    # 设置页/向导的字段表（`forms.rs` 的 `FIELDS` / `TABLES`）。
    #
    # 这里的键由**数据表路径**拼出来：`gui.setup.spec.<path>.label` / `.help`，
    # 表用 `.title` 与 `.col.<列key>`。与 `cli.cmd.*` 一样是动态寻址，静态扫描看不见，
    # 由 `crates/qcode-gui/tests/spec_i18n.rs` 遍历真实数据表双向比对。
    #
    # 不翻的：`tool:pattern`、`run_shell`、`PWD`、`SHLVL`、`cron`、`owner/repo`、
    # `stream_usage`（它是配置里的字段名）、`brave`/`tavily`/`searxng`（产品名）、
    # `none`/`proxy`/`strict`/`open`/`confine`（配置取值）。
    spec:
      context.window_tokens:
        label:
          en: "Context window (tokens)"
          zh-CN: "上下文窗口（tokens）"
        help:
          en: "Compaction starts at 78% of this value"
          zh-CN: "压缩从这一值的 78% 开始触发"
      agent.max_turns:
        label:
          en: "Max turns"
          zh-CN: "最大轮数"
        help:
          en: "Model calls allowed for one user message"
          zh-CN: "一条用户消息允许的模型调用次数"
      agent.max_cost_usd:
        label:
          en: "Max cost (USD)"
          zh-CN: "成本上限（USD）"
        help:
          en: "Optional; needs a pricing entry for the model"
          zh-CN: "可选；需要该模型在计价表里有条目"
      session_title.enabled:
        label:
          en: "Auto session title"
          zh-CN: "自动会话标题"
        help:
          en: "Model derives a title from the first message; off keeps the truncated-message fallback"
          zh-CN: "由模型从第一条消息取标题；关掉则用截断消息兜底"
      session_title.max_title_bytes:
        label:
          en: "Title byte cap"
          zh-CN: "标题字节上限"
        help:
          en: "Hard UTF-8 byte limit for any accepted title (80 ≈ 26 CJK chars)"
          zh-CN: "接受标题的硬性 UTF-8 字节上限（80 ≈ 26 个汉字）"
      session_title.fallback_max_words:
        label:
          en: "Fallback words"
          zh-CN: "兜底词数"
        help:
          en: "Word cap for the deterministic first-message fallback"
          zh-CN: "确定性兜底（截第一条消息）的词数上限"
      session_title.fallback_max_bytes:
        label:
          en: "Fallback bytes"
          zh-CN: "兜底字节数"
        help:
          en: "Byte cap for the fallback; must not exceed the title byte cap"
          zh-CN: "兜底的字节上限；不得超过标题字节上限"
      session_title.max_input_bytes:
        label:
          en: "Input byte cap"
          zh-CN: "输入字节上限"
        help:
          en: "First message larger than this skips generation"
          zh-CN: "第一条消息超过这个大小就跳过生成"
      session_title.max_output_tokens:
        label:
          en: "Output token cap"
          zh-CN: "输出 token 上限"
        help:
          en: "Independent of conversation calls"
          zh-CN: "与对话调用无关，单独计"
      session_title.timeout_ms:
        label:
          en: "Timeout (ms)"
          zh-CN: "超时（毫秒）"
        help:
          en: "Title call past this fails silently and keeps the fallback"
          zh-CN: "取标题的调用超过这个时间就静默放弃、保留兜底"
      session_title.target_words:
        label:
          en: "Target words"
          zh-CN: "目标词数"
        help:
          en: "Prompt target for non-CJK titles"
          zh-CN: "非 CJK 标题在提示里给的目标"
      session_title.target_cjk_chars:
        label:
          en: "Target CJK chars"
          zh-CN: "目标汉字数"
        help:
          en: "Prompt target for CJK titles"
          zh-CN: "CJK 标题在提示里给的目标"
      session_title.provider:
        label:
          en: "Title provider"
          zh-CN: "标题供应商"
        help:
          en: "Explicit route override; pair with the model. Empty follows the session's own route"
          zh-CN: "显式指定路由；要和标题模型成对。留空则跟随会话自身的路由"
      session_title.model:
        label:
          en: "Title model"
          zh-CN: "标题模型"
        help:
          en: "Pair with the title provider"
          zh-CN: "与标题供应商成对指定"
      terminal.shell:
        label:
          en: "Shell"
          zh-CN: "Shell"
        help:
          en: "Empty detects the shell you are already using; the built-in terminal starts it"
          zh-CN: "留空则探测你正在用的 shell；内建终端用它启动"
      terminal.start_cwd:
        label:
          en: "Start directory"
          zh-CN: "起始目录"
        help:
          en: "Empty follows the cwd of the active terminal, then home"
          zh-CN: "留空则跟随当前活动终端的 cwd，再退回家目录"
      terminal.font:
        label:
          en: "Font"
          zh-CN: "字体"
        help:
          en: "Empty picks a fixed-width font that covers CJK, when the system has one"
          zh-CN: "留空则在系统有可用字体时挑一个覆盖 CJK 的等宽字体"
      terminal.max_scrollback:
        label:
          en: "Scrollback lines"
          zh-CN: "回滚行数"
        help:
          en: "History kept per terminal, not visible rows"
          zh-CN: "每个终端保留的历史行数，不是可见行数"
      terminal.max_terminals:
        label:
          en: "Max terminals"
          zh-CN: "终端数上限"
        help:
          en: "Open tabs beyond this are refused"
          zh-CN: "超过这个数的标签页会被拒绝打开"
      shell.env_sampling:
        label:
          en: "Shell environment"
          zh-CN: "Shell 环境"
        help:
          en: "auto asks the login shell once per session; off keeps the allow-list only"
          zh-CN: "auto 表示每个会话问登录 shell 一次；off 则只用白名单"
      shell.env_command:
        label:
          en: "Sampling command"
          zh-CN: "采样命令"
        help:
          en: "Empty derives `{shell} -lic 'env -0'`; {shell} is substituted"
          zh-CN: "留空则推导成 `{shell} -lic 'env -0'`；`{shell}` 会被替换"
      shell.env_timeout_ms:
        label:
          en: "Sampling timeout (ms)"
          zh-CN: "采样超时（毫秒）"
        help:
          en: "A timeout keeps the previous snapshot instead of blocking the turn"
          zh-CN: "超时就沿用上一份快照，而不是卡住整个回合"
      shell.env_ttl_secs:
        label:
          en: "Snapshot lifetime (s)"
          zh-CN: "快照有效期（秒）"
        help:
          en: "0 keeps the first snapshot until an rc file changes"
          zh-CN: "0 表示一直沿用第一份快照，直到 rc 文件发生变化"
      shell.env_include:
        label:
          en: "Pass-through variables"
          zh-CN: "透传变量"
        help:
          en: "One prefix (COT_*) or exact name per line, copied from this process"
          zh-CN: "每行一个前缀（`COT_*`）或精确名字，从本进程复制"
      shell.env_exclude:
        label:
          en: "Dropped variables"
          zh-CN: "丢弃变量"
        help:
          en: "Noise such as PWD or SHLVL, removed from the snapshot"
          zh-CN: "`PWD`、`SHLVL` 这类噪声，从快照里删掉"
      shell.env_sample_sandboxed:
        label:
          en: "Sample inside the sandbox"
          zh-CN: "在沙箱内采样"
        help:
          en: "Off by default: the sandbox hides most of the user's real environment"
          zh-CN: "默认关：沙箱会把用户真实环境挡掉大半"
      shell.audit:
        label:
          en: "Environment audit"
          zh-CN: "环境审计"
        help:
          en: "names records variable names and changes, never values"
          zh-CN: "`names` 只记变量名与变化，从不记值"
      ui.language:
        label:
          en: "Language"
          zh-CN: "界面语言"
        help:
          en: "Follow the system, or force one. Takes effect after a restart; QCODE_LANG overrides it (the daemon is the exception: here it wins)"
          zh-CN: "跟随系统，或强制指定一种。重启后生效；`QCODE_LANG` 优先于它（daemon 是例外，这里由它说了算）"
      ui.busy_delivery:
        label:
          en: "Busy delivery"
          zh-CN: "忙碌投递"
        help:
          en: "Sending while a turn runs queues a follow-up or steers into it"
          zh-CN: "回合进行中发送时：排队成一条后续消息，还是直接插进去"
      agent.snapshot_shell:
        label:
          en: "Snapshot before shell"
          zh-CN: "Shell 前快照"
        help:
          en: "Enables rollback for shell/MCP edits; capped at 64 MB"
          zh-CN: "给 shell／MCP 的改动开启回滚；上限 64 MB"
      sandbox.mode:
        label:
          en: "Sandbox mode"
          zh-CN: "沙箱模式"
        help:
          en: "OS sandbox for run_shell; none keeps approval as the boundary"
          zh-CN: "`run_shell` 使用的系统沙箱；`none` 则仍以审批为边界"
      sandbox.network:
        label:
          en: "Network mode"
          zh-CN: "网络模式"
        help:
          en: "off: no egress; proxy: through the proxy; strict: proxy only (macOS); open: raw sockets"
          zh-CN: "`off` 完全不出网；`proxy` 走代理；`strict` 只允许代理（macOS）；`open` 直连裸网络"
      approval.allow:
        label:
          en: "Always allow"
          zh-CN: "总是允许"
        help:
          en: "One `tool:pattern` per line, e.g. run_shell:echo * (ADR-0065)"
          zh-CN: "每行一个 `tool:pattern`，例如 `run_shell:echo *`（ADR-0065）"
      approval.deny:
        label:
          en: "Never allow"
          zh-CN: "永不允许"
        help:
          en: "Same shorthand; a deny wins over an allow"
          zh-CN: "同样的简写；`deny` 优先于 `allow`"
      sandbox.extra_writable:
        label:
          en: "Extra writable roots"
          zh-CN: "额外可写根目录"
        help:
          en: "One path per line, whole subtree; every backend. Not `/`, `~`, `/home`"
          zh-CN: "每行一个路径，整棵子树；所有后端都生效。不能用 `/`、`~`、`/home`"
      sandbox.extra_read:
        label:
          en: "Extra readable roots"
          zh-CN: "额外可读根目录"
        help:
          en: "One path per line, whole subtree; read + execute, every backend"
          zh-CN: "每行一个路径，整棵子树；读 + 执行，所有后端都生效"
      sandbox.allow_pty:
        label:
          en: "Allow pseudo-terminals"
          zh-CN: "允许伪终端"
        help:
          en: "landlock: lets a confined process open a PTY. The only devpts available is the host's, so this also reaches your other terminals' shells — off by default; prefer mode = bwrap"
          zh-CN: "landlock：让受限进程能打开 PTY。可用的 devpts 只宿主那一个，所以这也会碰到你其它终端的 shell——默认关；优先选 `mode = bwrap`"
      network.allow:
        label:
          en: "Allowed hosts"
          zh-CN: "允许的主机"
        help:
          en: "host or host:port; provider host is added automatically"
          zh-CN: "`host` 或 `host:port`；供应商自己的主机自动加入"
      network.allow_private:
        label:
          en: "Allow private/loopback hosts"
          zh-CN: "允许私有/回环主机"
        help:
          en: "Only for local Ollama or test servers"
          zh-CN: "只有本地 Ollama 或测试服务器才需要"
      network.unknown:
        label:
          en: "Unknown host policy"
          zh-CN: "未知主机策略"
        help:
          en: "ask is enforced by tool approvals; shell/MCP deny"
          zh-CN: "`ask` 由工具审批执行；shell／MCP 一律拒绝"
      network.audit:
        label:
          en: "Audit network"
          zh-CN: "审计网络"
        help:
