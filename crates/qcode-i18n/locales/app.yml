        zh-CN: "沙箱"
      network:
        en: "Network"
        zh-CN: "网络"
    action:
      quit:
        en: "Quit"
        zh-CN: "退出"
      back:
        en: "Back"
        zh-CN: "上一步"
      next:
        en: "Next"
        zh-CN: "下一步"
      remove:
        en: "Remove"
        zh-CN: "移除"
    window_title:
      en: Settings
      zh-CN: 设置
    # 下面五条原本是**纯英文字面量**：门禁 2 只查中文，所以它们从第一批起就一直
    # 漏在中文界面里。硬棘轮对这一类的盲区见 I18N.md（en 是源语言，英文常量长得
    # 跟源语言一样）。
    open_in_editor:
      en: Open in editor
      zh-CN: 在编辑器中打开
    save_and_start:
      en: Save & Start
      zh-CN: 保存并开始
    provider_key_label:
      en: API key (stored in Keychain, not config.toml)
      zh-CN: API 密钥（存入钥匙串，不写 config.toml）
    provider_key_aria:
      en: Provider API key for Keychain
      zh-CN: 存入钥匙串的 Provider API 密钥
    store_key:
      en: Store key
      zh-CN: 存入密钥
    add_custom_row:
      en: Add custom row
      zh-CN: 添加自定义行
    autosave:
      en: Autosave · changes are written immediately
      zh-CN: 自动保存 · 修改即时写入
    # 每一页标题下的一句话。它是 `Page` 的属性，不是某段 JSX 里的常量。
    section_intro:
      models:
        en: Default model and provider setup
        zh-CN: 配置默认模型与各模型供应商
      agent:
        en: Context, turn budgets and message behaviour
        zh-CN: 上下文、回合预算与消息行为
      network_sandbox:
        en: Sandbox and network egress policy
        zh-CN: 沙箱与网络出口策略
      search:
        en: Web-search backend and its key
        zh-CN: 联网搜索后端与密钥
      mcp:
        en: stdio MCP servers
        zh-CN: stdio MCP 服务器
      skills:
        en: Agent skills
        zh-CN: Agent 技能
      approval_pricing:
        en: Approval rules and token pricing
        zh-CN: 审批规则与 token 定价
      appearance:
        en: Theme, type size and interface preferences
        zh-CN: 主题、字号与界面偏好
      update:
        en: Version checks and update source
        zh-CN: 版本检查与更新源
    # 向导模式下的只读目录：解析器认识的全部 route 及其协议/配置/凭证状态。
    provider_directory:
      title:
        en: Provider directory
        zh-CN: 提供方目录
      line:
        en: "%{0} (%{1}) · %{2} · %{3} · credentials: %{4}"
        zh-CN: "%{0} (%{1}) · %{2} · %{3} · 凭证: %{4}"
      # 这一行里的「有没有配置文件」。`catalog default` 指走适配器内置目录、
      # 没有自己的 profile。
      state:
        configured:
          en: profile configured
          zh-CN: 已配置
        catalog_default:
          en: catalog default
          zh-CN: 目录默认
    # 「网络出口」组的整组替代说明，以及 strict 与 sandbox 模式不匹配的警告。
    network:
      open_note:
        en: "Plain network (open): no egress proxy is started, so the allow list, private ranges, unknown-host policy and audit all have no effect."
        zh-CN: 当前为裸网络（open）：不启动出口代理，白名单、私有网段、未知主机策略与审计均不生效。
      off_note:
        en: "All outbound traffic is blocked by the sandbox (off): no egress proxy is started, so the allow list, private ranges, unknown-host policy and audit all have no effect."
        zh-CN: 出站已被沙箱全部阻断（off）：不启动出口代理，白名单、私有网段、未知主机策略与审计均不生效。
      strict_mode:
        en: "⚠ network = strict only supports [sandbox] mode = \"sandbox-exec\" (currently %{0}); saving this way breaks assembly — set Network to proxy or off."
        zh-CN: "⚠ network = strict 只支持 [sandbox] mode = \"sandbox-exec\"（当前是 %{0}）；这样保存后装配会失败，请把 Network 改成 proxy 或 off。"
    sandbox:
      # 选了 bwrap 但没装。命令名与发行版名不翻。
      bwrap_missing:
        en: >-
          bwrap unavailable: bubblewrap is not installed. Install it with your
          system package manager (Debian/Ubuntu: sudo apt install bubblewrap;
          Fedora: sudo dnf install bubblewrap; Arch: sudo pacman -S bubblewrap),
          then retry.
        zh-CN: >-
          bwrap 不可用：bubblewrap 未安装。请用系统包管理器安装 bubblewrap
          （Debian/Ubuntu：sudo apt install bubblewrap；
          Fedora：sudo dnf install bubblewrap；Arch：sudo pacman -S bubblewrap），
          然后重试。
      unavailable:
        en: Sandbox backend unavailable
        zh-CN: 沙箱后端不可用
      dismiss:
        en: Got it
        zh-CN: 知道了
    # `[shell]` 下「采样一次」按钮及其一行结果。
    shell_probe:
      action:
        en: Sample once
        zh-CN: 采样一次
      running:
        en: Sampling…
        zh-CN: 采样中…
      interrupted:
        en: Sampling interrupted
        zh-CN: 采样中断
      off:
        en: Sampling is off ([shell] env_sampling = "off")
        zh-CN: 采样已关闭（[shell] env_sampling = "off"）
      # 采样失败时 error 可能为空，那时用 `unknown_cause` 顶上。
      failed:
        en: "Sampling failed: %{0}"
        zh-CN: "采样失败: %{0}"
      unknown_cause:
        en: unknown reason
        zh-CN: 未知原因
      summary:
        en: "%{0} · %{1} vars · %{2}ms%{3}"
        zh-CN: "%{0} · %{1} 个变量 · %{2}ms%{3}"
      # 拼在 `summary` 末尾，所以自带前导分隔符。
      cached:
        en: " · cached"
        zh-CN: " · 缓存"
    # 表格表单里「获取可用模型」的探测结果（`setup/tables.rs`）。
    probe:
      add_provider_first:
        en: Add this provider first, then fetch its models
        zh-CN: 先添加该提供方，再获取可用模型
      base_required:
        en: Fill in the API endpoint first
        zh-CN: 请先填写 API 地址
      running:
        en: Probing…
        zh-CN: 正在探测中…
      no_models:
        en: This provider listed no models; add them by hand.
        zh-CN: 该提供方没有列出任何模型，请手动添加。
      failed:
        en: "Probe failed: %{0}"
        zh-CN: "探测失败: %{0}"
      interrupted:
        en: Probe interrupted
        zh-CN: 探测中断
    # 表格表单里的密钥写入结果。
    keychain:
      empty:
        en: The API key cannot be empty, so it cannot be stored in the credential store
        zh-CN: API 密钥不能为空，无法存入凭据库
      saved:
        en: Saved %{0}'s API key to the system keychain
        zh-CN: 已保存 %{0} 的 API 密钥到系统钥匙串
    # 自动保存失败时的错误行（`setup/save.rs`）。全部进 `self.error`，显示在表单上方。
    save_error:
      provider_without_models:
        en: "Provider %{0} has no models: add at least one model, or fill in a default model."
        zh-CN: 提供方 %{0} 没有模型：请添加至少一个模型或填写默认模型。
      # 一条模板覆盖三处：字段路径（`sandbox.mode`）、`config.toml`、`gui.json`。
      # 中文都是「<什么> 没能写入：<为什么>」，所以文件名不必单独开 key。
      write_failed:
        en: "Could not write %{0}: %{1}"
        zh-CN: "%{0} 没能写入：%{1}"
      field_invalid:
        en: "%{0} has an invalid value; nothing was written: %{1}"
        zh-CN: "%{0} 的值不合法，改动没有写入：%{1}"
      form_invalid:
        en: "The form still has problems; nothing was written: %{0}"
        zh-CN: 表单还有问题，改动没有写入：%{0}

# GUI（P1）。key 按 `gui.<区域>.<元素>.<角色>` 分层。
  daemon:
    # 悬停提示：说清「点下去会发生什么」与图标为什么是那个亮度。
    tooltip:
      start:
        en: "The resident driver is not running (grey icon). Click to start: tasks still fire after you close the window."
        zh-CN: 常驻驱动没在跑（图标灰）。点一下启动：关掉窗口后任务仍会触发。
      stop:
        en: "The resident driver is running (green icon). Click to stop: nothing fires at its time any more, but the tasks and the list stay."
        zh-CN: 常驻驱动在跑（图标绿）。点一下停止：到点不再触发，任务与列表都还在。
      window_driven:
        en: "This window is driving right now; there is no resident driver (grey icon). Click to start one: it takes over once this window exits."
        zh-CN: 现在由这个窗口驱动，没有常驻驱动（图标灰）。点一下启动：它会等这个窗口退出后接手。
      occupied_elsewhere:
        en: A resident driver is running (green icon), but it serves another data directory — one per user. Click to stop it.
        zh-CN: 常驻驱动在跑（图标绿），但服务的是另一个数据目录——一个用户只有一个。点一下把它停掉。
      unknown:
