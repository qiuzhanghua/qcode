  # 沙箱与授权的自述（`qc doctor` 与授权报错共用同一份）。
  #
  # 为什么不翻实现名：`sandbox-exec` / `bubblewrap` / `Landlock` / `windows-acl`
  # 是**机制名**，用户要拿它去对照 man page 与 ADR；翻了就查不到。
  sandbox:
    describe:
      macos_denied:
        en: "sandbox-exec (network denied)"
        zh-CN: "sandbox-exec（网络拒绝）"
      macos_allowed:
        en: "sandbox-exec (network allowed)"
        zh-CN: "sandbox-exec（网络允许）"
      macos_proxy_only:
        en: "sandbox-exec (network proxy-only on localhost:%{0})"
        zh-CN: "sandbox-exec（网络只能走 localhost:%{0} 的代理）"
      bwrap:
        en: "bubblewrap (network %{0}, writes: %{1})"
        zh-CN: "bubblewrap（网络%{0}，可写：%{1}）"
      landlock:
        en: "Landlock filesystem confinement (network not restricted, writes: %{0})"
        zh-CN: "Landlock 文件系统限制（网络不受限，可写：%{0}）"
      windows_acl:
        en: "windows-acl (partial): write-restricted token; writes allowed only under %{0} and %{1}; reads and network are not restricted; hard links and named pipes are not covered"
        zh-CN: "windows-acl（部分）：写受限令牌；只允许写入 %{0} 和 %{1}；读与网络不受限；硬链接与命名管道不在覆盖范围内"
      noop:
        en: "no OS sandbox; approval is the execution boundary"
        zh-CN: "没有系统沙箱；执行边界就是审批"
      network_allowed:
        en: "allowed"
        zh-CN: 允许
      network_denied:
        en: "denied"
        zh-CN: 拒绝
      writes_roots_caches:
        en: "roots + build caches + host /tmp"
        zh-CN: "根目录 + 构建缓存 + 宿主 /tmp"
      writes_roots_only:
        en: "roots only"
        zh-CN: "只有根目录"
      extra_read:
        en: ", extra read: [%{0}]"
        zh-CN: "，额外可读：[%{0}]"
      extra_write:
        en: ", extra write: [%{0}]"
        zh-CN: "，额外可写：[%{0}]"
      pty:
        en: ", pty: host devpts"
        zh-CN: "，pty：宿主 devpts"
  driver:
    # 一句话说清「能不能触发」。工具结果与界面共用同一份。
    describe:
      running:
        en: The driver is running (scheduled tasks fire on time)
        zh-CN: 驱动在跑（定时任务会正常触发）
      held:
        en: The driver is running but its heartbeat is stale (it may be suspended or stuck; it resumes once awake)
        zh-CN: 驱动在跑，但心跳已过期（可能被挂起或者卡住；醒来会继续）
      gone:
        en: The driver is not running (it exited last time; triggers do not fire and are recorded as missed)
        zh-CN: 驱动不在跑（上次退出了；到点不会触发，记为错过）
      unknown:
        en: Unknown (no frontend that drives scheduled tasks has ever run against this data directory)
        zh-CN: 未知（这个数据目录还没有会驱动定时任务的前端跑过）
    # `驱动：<describe>` 这层包装（工具列表第一行）。
    footer:
      en: "Driver: %{0}"
      zh-CN: "驱动：%{0}"
    heartbeat:
      never:
        en: no heartbeat yet
        zh-CN: 还没有心跳
      at:
        en: "last heartbeat %{0}"
        zh-CN: 上次心跳 %{0}
    # 跟随结果的整段说明。三段措辞各自写死三件事（谁在触发、关窗≠停、不补跑），
    # 翻的时候不能合并或省略其中任何一件——理由见 `driver_footer` 的函数注释。
    detail:
      running:
        en: "Driver: running (deliveries fire on time)."
        zh-CN: 驱动：在跑（到点会正常投递）。
      held:
        en: "**The driver is running, but its heartbeat is stale** (%{0}): the process holding the scheduling clock is still there (the lock is in its hand), so no task is lost, but it may be suspended or stuck. It resumes firing per the rules once awake — windows missed in this stretch still count as missed and are not replayed."
        zh-CN: "**驱动在跑，但心跳已过期**（%{0}）：持有调度时钟的进程还在（锁在它手上），任务没有丢，但它可能被挂起或者卡住了。唤醒后会继续按规则触发——这段里错过的窗口仍然记为错过，不补跑。"
      gone:
        en: "**The driver is not running** (last heartbeat %{0}, the process exited): this task needs a process holding the scheduling clock before it fires. Either works: the GUI is open (closing the window only hides to the tray; **only quitting the process stops it**), or `qc daemon start` runs a `qcd` with no interface. While it is not running, triggers never happen and are recorded as missed — they are not replayed."
        zh-CN: "**驱动不在跑**（上次心跳 %{0}，进程已退出）：该任务需要有进程持有调度时钟才会触发。两种都可以：GUI 开着（关窗只是隐藏到托盘，**退出进程才停**），或者 `qc daemon start` 起一个没有界面的 `qcd`。它没在跑的时候，到点不会发生，并记为错过——不补跑。"
      unknown:
        en: "**Driver unknown**: no frontend that drives scheduled tasks has ever run against this data directory. This task needs a process holding the scheduling clock before it fires: the GUI is open (closing the window only hides to the tray; **only quitting the process stops it**), or `qc daemon start` runs a `qcd` with no interface. While it is not running, triggers never happen and are recorded as missed — they are not replayed."
        zh-CN: "**驱动未知**：这个数据目录还没有会驱动定时任务的前端跑过。该任务需要有进程持有调度时钟才会触发：GUI 开着（关窗只是隐藏到托盘，**退出进程才停**），或者 `qc daemon start` 起一个没有界面的 `qcd`。它没在跑的时候，到点不会发生，并记为错过——不补跑。"
  approval:
    with_timeout:
      en: "Approval: %{0} (auto-rejected on timeout)."
      zh-CN: "审批：%{0}(超时自动拒绝)。"
    no_deadline:
      en: "Approval: **no deadline set** — with a human around it waits indefinitely. Running unattended (resident daemon) it fills in %{0} and auto-rejects on timeout: with nobody there, waiting would hold that session's write lock forever. To change it, pass `--approval-timeout-secs`."
      zh-CN: "审批：**未设截止时间**——有人值守时一直等人工。无人值守执行时（常驻 daemon）会补 %{0}，超时自动拒绝：没有人在旁边，等下去会把那个会话的写锁一直握着。要改就加 `--approval-timeout-secs`。"
  schedule:
    row:
      en: "- [%{0}] %{1} (id: %{2})\n  Rule: %{3} · Target: %{4} · Next: %{5}"
      zh-CN: "- [%{0}] %{1}（id: %{2}）\n  规则：%{3} · 目标：%{4} · 下次触发：%{5}"
    # CLI 在行末补工作目录（工具详情里单独有一行）。
    row_dir:
      en: " · dir: %{0}"
      zh-CN: " · 目录：%{0}"
    list_header:
      en: "Scheduled tasks (%{0}):"
      zh-CN: "共 %{0} 个定时任务："
    list_empty:
      en: There are no scheduled tasks.
      zh-CN: 当前没有定时任务。
    # 只有 `qc schedule list` 会说的话：没有任务时提示 `--all`。
    list_empty_all:
      en: There are no scheduled tasks.
      zh-CN: 当前没有定时任务。
    list_empty_active_only:
      en: There are no scheduled tasks (`--all` also lists paused and finished ones).
      zh-CN: 当前没有定时任务（`--all` 连暂停/已结束的也列出来）。
    # `qc schedule remove <id>` 找不到目标。
    not_found_by_id:
      en: "No scheduled task with id %{0}"
      zh-CN: 没有 id 为 %{0} 的定时任务
    # 详情里的字段名与行。行是整句，因为中英的字段顺序与标点不同。
    field:
      title:
        en: "Scheduled task %{0} (id: %{1})"
        zh-CN: "定时任务 %{0}（id: %{1}）"
      status:
        en: "Status: %{0}"
        zh-CN: "状态：%{0}"
      rule:
        en: "Rule: %{0}"
        zh-CN: "规则：%{0}"
      target:
        en: "Target: %{0}"
        zh-CN: "目标：%{0}"
      next_fire:
        en: "Next: %{0}"
        zh-CN: "下次触发：%{0}"
      min_interval:
        en: "Minimum delivery interval: %{0}s (global guard against flooding)"
        zh-CN: "最小投递间隔：%{0}s（全局护栏，防止轰炸）"
      cwd:
        en: "Working directory: `%{0}`"
        zh-CN: "工作目录：`%{0}`"
      reserved_session:
        en: "Reserved session: `%{0}`"
        zh-CN: "预留会话：`%{0}`"
      last_delivery:
        en: "Last delivery: %{0} → %{1} (message %{2})"
        zh-CN: "最近投递：%{0} → %{1}（message %{2}）"
      missed:
        en: "Missed: %{0} (a trigger while the host was down does not count and is not replayed)"
        zh-CN: "错过：%{0} 次（宿主不在运行时到点不算，不补跑）"
      runs:
        en: "Run log: %{0} entries (last 30 days / 200 entries kept)"
        zh-CN: "运行记录：共 %{0} 条（保留最近 30 天 / 200 条）"
      delivery_line:
        en: "  - %{0} delivered to %{1} (message %{2}): %{3}"
        zh-CN: "  - %{0} 投递到 %{1}（message %{2}）：%{3}"
      pruned:
        en: (earlier entries have been pruned)
        zh-CN: （更早的记录已被裁剪）
    weekday:
      sun:
        en: Sun
        zh-CN: 周日
      mon:
        en: Mon
        zh-CN: 周一
      tue:
        en: Tue
        zh-CN: 周二
      wed:
        en: Wed
        zh-CN: 周三
      thu:
        en: Thu
        zh-CN: 周四
      fri:
        en: Fri
        zh-CN: 周五
      sat:
        en: Sat
        zh-CN: 周六
      # 多选星期之间的分隔符：中文顿号、英文逗号加空格。它跟星期名一起构成
      # `weekly` 的展示形式，所以不能写死在 `join` 里。
      separator:
        en: ", "
        zh-CN: "、"
    target:
      session:
        en: "session `%{0}`"
        zh-CN: "会话 `%{0}`"
      new_once:
        en: a new session (created by the first delivery, then reused)
        zh-CN: 新会话（首次投递创建并复用）
      new:
        en: a new session (every delivery creates one)
        zh-CN: 新会话（每次投递都新建）
    rule:
      monthly:
        en: "monthly on day %{0} at %{1}:%{2}"
        zh-CN: "monthly %{0}日 %{1}:%{2}"
  # CLI 追问的输入提示（`qc` 在终端里问用户）。
  question:
    choice_hint:
      en: "  > pick numbers (comma-separated; empty = skip; anything else = free answer) "
      zh-CN: "  > 选择编号（逗号分隔；留空=跳过；其他=自由回答） "
  # run 模式的暂停摘要：用户可见，不是 prompt。
  run:
    no_file_changes:
      en: No files changed this run
      zh-CN: 本次没有改动文件
    tool_calls:
      en: "\n%{0} tool calls"
      zh-CN: "\n调用了 %{0} 次工具"
    tool_failures:
      en: "\n%{0} tool calls failed"
      zh-CN: "\n%{0} 次工具调用失败"
    last_words:
      en: "\nLast word: %{0}"
      zh-CN: "\n最后的说明：%{0}"
  # 侧栏「在对话中创建定时任务」预填进输入框的引导文字。
  #
  # 它同时是**会话标题要剥掉的前缀**（`strip_schedule_prefill` 用 `strip_prefix`
  # 比对）。所以前缀与预填必须取同一条 key：任何一处写死字面量，只要界面语言变了，
  # 剥离就静默失效，标题又会被这句引导语顶满。
  prefill:
    schedule_draft:
      en: Create a scheduled task for this requirement.
      zh-CN: 请根据需求创建一个定时任务。

# CLI（`qc`）运行时输出与 TUI 提示。帮助文本（clap）另算，见 I18N.md §4.3。
cli:

  # ---- CLI 命令的输出（不是帮助）----
  #
  # 这一批是 `qc <cmd>` 跑完之后用户读的那几行。与 `cli.cmd.*` 的区别：那些是
  # **帮助**（解析时求值），这些是**结果**（运行时求值），所以它们跟随
  # `[ui] language`，而 `--help` 只跟随环境变量/系统（I18N.md §10.14）。
  #
  # 不翻的（有意）：`qc daemon:` / `qcode:` 这类**命令名前缀**、`key = value` 的键名、
  # 配置片段（`api_key_command = [...]`）、`[tool]` / `[approval]` 这类带方括号的
  # 进度标记（§10.15 记了理由）。
  logs:
    no_files:
      en: "no log files in %{0}"
      zh-CN: "%{0} 里没有日志文件"
    waiting:
      en: "waiting for the first line in %{0} (Ctrl-C to stop)"
      zh-CN: "正在等 %{0} 里的第一行（Ctrl-C 停止）"
    searching:
      en: "(searching %{0} files in %{1})"
      zh-CN: "（正在搜索 %{1} 里的 %{0} 个文件）"
    older:
      en: "(older files in %{0}: %{1})"
      zh-CN: "（%{0} 里还有 %{1} 个更早的文件）"
    skipping:
      en: "qcode: skipping %{0}: %{1}"
      zh-CN: "qcode：跳过 %{0}：%{1}"
  skills:
    disabled:
      en: "skills are disabled ([skills] enabled = false)"
      zh-CN: "技能已关闭（`[skills] enabled = false`）"
    none_found:
      en: "no skills discovered; checked:"
      zh-CN: "没有发现技能；检查过这些位置："
    count:
      en: "%{0} skill(s)"
      zh-CN: "%{0} 个技能"
    skill_line:
      en: "%{0}  [%{1}]  files=%{2}"
      zh-CN: "%{0}  [%{1}]  文件 %{2} 个"
  shell_env:
    sampling_off:
      en: "environment sampling is off ([shell] env_sampling = \"off\")"
      zh-CN: "环境采样已关闭（`[shell] env_sampling = \"off\"`）"
    sampling_off_detail:
      en: "run_shell only sees the allow list plus the egress proxy variables"
      zh-CN: "run_shell 只能看到白名单加上出网代理那几个变量"
    sampling_failed:
      en: "sampling failed after %{0}ms"
      zh-CN: "采样在 %{0}ms 后失败"
    last_attempt_failed:
      en: "  last attempt failed: %{0}"
      zh-CN: "  上一次尝试失败：%{0}"
    full_needs_terminal:
      en: "--full needs a terminal; printing names only"
      zh-CN: "--full 需要终端；这里只列出变量名"
    new_since:
      en: "  new since the previous sample: %{0}"
      zh-CN: "  相比上一次采样新增：%{0}"
    gone_since:
      en: "  gone since the previous sample: %{0}"
      zh-CN: "  相比上一次采样消失：%{0}"
    summary:
      en: "shell: %{0}   variables: %{1}   sampled in %{2}ms%{3}"
      zh-CN: "shell：%{0}   变量 %{1} 个   采样耗时 %{2}ms%{3}"
    summary_cached:
      en: "  (cached)"
      zh-CN: "  （来自缓存）"
  run:
    session:
      en: "session: %{0}"
      zh-CN: "会话：%{0}"
    cost:
      en: "cost: $%{0} (estimated)"
      zh-CN: "花费：$%{0}（估算）"
    paused:
      en: "paused: %{0}"
      zh-CN: "暂停：%{0}"
    pause_used_turns:
      en: "used %{0}/%{1} turns"
      zh-CN: "已用 %{0}/%{1} 轮"
    pause_cost:
      en: "cost $%{0} of $%{1}"
      zh-CN: "已花 $%{0}，上限 $%{1}"
    continue_hint:
      en: "continue: `qc run --continue`, or send another message; raise [agent] max_turns / --max-cost to give it more room"
      zh-CN: "继续：`qc run --continue`，或者再发一条消息；想给更多空间就调高 `[agent] max_turns` / `--max-cost`"

  cfg:
    show_outdated:
      en: "this file is schema %{0}; `qc config migrate` can drop duplicated defaults (backup kept as .bak)"
      zh-CN: "这个文件是 schema %{0}；`qc config migrate` 可以合并掉重复的默认值（会留一份 .bak 备份）"
    edit_ok:
      en: "config ok: %{0}"
      zh-CN: "配置没问题：%{0}"
    edit_bad:
      en: "warning: %{0}"
      zh-CN: "警告：%{0}"
    migrate_current:
      en: "%{0}: already schema %{1} (nothing to do)"
      zh-CN: "%{0}：已经是 schema %{1}（无需改动）"
    migrate_done:
      en: "%{0}: schema %{1} → %{2}"
      zh-CN: "%{0}：schema %{1} → %{2}"
    migrate_folded_defaults:
      en: "  folded %{0} provider default_model key(s) into [default-model]"
      zh-CN: "  把 %{0} 处 provider 的 default_model 折进了 `[default-model]`"
    migrate_folded_network:
      en: "  folded [network] enabled/mode into [sandbox] network"
      zh-CN: "  把 `[network]` 的 enabled/mode 折进了 `[sandbox]` 的 network"
    migrate_collapsed_models:
      en: "  collapsed %{0} model table(s) into `models = [\"id\", …]`"
      zh-CN: "  把 %{0} 个 model 表压成了 `models = [\"id\", …]`"
    migrate_backup:
      en: "  backup: %{0}"
      zh-CN: "  备份：%{0}"
    mcp_added:
      en: "added MCP server '%{0}' (%{1}) to %{2}"
      zh-CN: "已添加 MCP 服务器 `%{0}`（%{1}）到 %{2}"
    mcp_removed:
      en: "removed MCP server '%{0}' from %{1}"
      zh-CN: "已从 %{1} 移除 MCP 服务器 `%{0}`"
    init_wrote:
      en: "wrote %{0} from template %{1}"
      zh-CN: "已用模板 %{1} 写出 %{0}"
    init_not_loadable:
      en: "warning: wrote %{0} but it does not load: %{1}"
      zh-CN: "警告：写出了 %{0}，但它加载不起来：%{1}"
    append_cancelled:
      en: "cancelled; %{0} unchanged"
      zh-CN: "已取消；%{0} 未改动"
    append_done:
      en: "appended [providers.%{0}] to %{1}"
      zh-CN: "已把 `[providers.%{0}]` 追加到 %{1}"
    key_hint:
      en: "this provider reads the key from %{0}: set it in the environment, or store it with `echo <key> | qc config key set <provider>`"
      zh-CN: "这个供应商从 %{0} 读密钥：把它设在环境变量里，或者用 `echo <key> | qc config key set <provider>` 存起来"
  template:
    line:
      en: "%{0} %{1} [built-in] %{2} (%{3}; %{4})"
      zh-CN: "%{0} %{1} [built-in] %{2}（%{3}；%{4}）"
    applies:
      en: "applies here"
      zh-CN: 本机适用
    not_for_platform:
      en: "not for this platform"
      zh-CN: 不适用于本平台
    count:
      en: "%{0} template(s)"
      zh-CN: "%{0} 个模板"

  sandbox_grant:
    granted:
      en: "granted windows-acl write access to %{0}"
      zh-CN: "已给 %{0} 授予 windows-acl 写权限"
    revoked:
      en: "revoked %{0} ACE(s) under %{1}"
      zh-CN: "已撤销 %{1} 下的 %{0} 条 ACE"

  # `qc doctor`：标签（第一参数）与明细（第二参数）。
  #
  # 明细里混着两类东西，处理方式不同：
  # - **散文**（`mock provider; no network calls`）→ 翻译；
  # - **数据**（路径、版本号、来自下层 crate 的错误串）→ 原样透传。它们是运行期
  #   事实，不是这句话的一部分，翻了反而对不上真实输出。
  doctor:
    all_passed:
      en: "all checks passed"
      zh-CN: 全部检查通过
    failed:
      en: "%{0} check(s) failed"
      zh-CN: "%{0} 项检查未通过"
    banner:
      en: "qcode %{0}"
      zh-CN: "qcode %{0}"
    label:
      # 程序名 / 协议名 / 配置键名不翻（与设置页一致）。
      acp: { en: "ACP", zh-CN: "ACP" }
      base_url: { en: "base url", zh-CN: "基础 URL" }
      config: { en: "config", zh-CN: 配置 }
      config_schema: { en: "config schema", zh-CN: "配置 schema" }
      config_writable: { en: "config writable", zh-CN: 配置可写 }
      connectivity: { en: "connectivity", zh-CN: 连通性 }
      credentials: { en: "credentials", zh-CN: 凭据 }
      data_dir: { en: "data dir", zh-CN: 数据目录 }
      key_storage: { en: "key storage", zh-CN: 密钥存储 }
      mcp: { en: "mcp", zh-CN: "MCP" }
      mcp_path: { en: "mcp path", zh-CN: "MCP 路径" }
      mcp_probe: { en: "mcp probe", zh-CN: "MCP 探测" }
      model: { en: "model", zh-CN: 模型 }
      network_hard_mode: { en: "network hard mode", zh-CN: 网络强制模式 }
      pricing: { en: "pricing", zh-CN: 计价 }
      project_config: { en: "project config", zh-CN: 项目配置 }
      provider: { en: "provider", zh-CN: 供应商 }
      rustc: { en: "rustc", zh-CN: "rustc" }
      sandbox: { en: "sandbox", zh-CN: 沙箱 }
      sandbox_extra_read: { en: "sandbox extra_read", zh-CN: "沙箱 extra_read" }
      sandbox_extra_writable: { en: "sandbox extra_writable", zh-CN: "沙箱 extra_writable" }
      temp: { en: "temp", zh-CN: 临时目录 }
      token: { en: "token", zh-CN: 令牌 }
      update: { en: "update", zh-CN: 更新 }
      web_search: { en: "web_search", zh-CN: "web_search" }
      # 拼接标签：`%{0}` 是已经翻好的基础标签，后缀才是要翻的那部分。
      mcp_network: { en: "%{0} network", zh-CN: "%{0} 网络" }
      mcp_bearer: { en: "%{0} bearer_token_env_var", zh-CN: "%{0} bearer_token_env_var" }
      mcp_env: { en: "%{0} env %{1}", zh-CN: "%{0} env %{1}" }
      mcp_field: { en: "%{0} %{1}", zh-CN: "%{0} %{1}" }
      mcp_credentials: { en: "%{0} credentials", zh-CN: "%{0} 凭据" }
    detail:
      config_no_parent:
        en: "config path has no parent directory"
        zh-CN: 配置路径没有父目录
      config_dir_hint:
        en: "this directory refuses new files; either allow qc in your AV/EDR policy, set QCODE_CONFIG to a writable path, or create a `qcode.portable` file next to qc.exe to keep the config there"
        zh-CN: 这个目录不接受新文件；要么在杀软/EDR 策略里放行 qc，要么把 QCODE_CONFIG 指到可写路径，或者在 qc.exe 旁边建一个 `qcode.portable` 把配置留在那儿
      config_not_found:
        en: "not found: %{0}"
        zh-CN: "没找到：%{0}"
      config_not_found_defaults:
        en: "not found: %{0} (using defaults)"
        zh-CN: "没找到：%{0}（用默认值）"
      schema_version:
        en: "version %{0} (this build supports %{1})"
        zh-CN: "版本 %{0}（这个构建支持 %{1}）"
      search_disabled:
        en: "disabled ([search] enabled = false)"
        zh-CN: "已关闭（`[search] enabled = false`）"
      search_backend_ready:
        en: "backend '%{0}' is ready"
        zh-CN: "后端 `%{0}` 就绪"
      search_searxng_needs_url:
        en: "backend 'searxng' needs [search] base_url; the tool is not registered"
        zh-CN: "后端 `searxng` 需要 `[search] base_url`；这个工具没有被注册"
      search_needs_key:
        en: "export %{0} (or set [search] api_key_env); the tool is not registered"
        zh-CN: "导出 %{0}（或设置 `[search] api_key_env`）；这个工具没有被注册"
      creds_mock:
        en: "mock provider; no network calls"
        zh-CN: "mock 供应商；不发网络请求"
      creds_key_present:
        en: "API key present (%{0})"
        zh-CN: "API key 已就位（%{0}）"
      creds_keyless:
        en: "keyless provider"
        zh-CN: 无需密钥的供应商
      pricing_stops:
        en: "%{0} declared; `--max-cost` stops at the limit"
        zh-CN: "已声明 %{0}；`--max-cost` 到点就停"
      pricing_no_stop:
        en: "%{0} declared; set `--max-cost` or `[agent] max_cost_usd` to actually stop"
        zh-CN: "已声明 %{0}；要真的停下来，得设 `--max-cost` 或 `[agent] max_cost_usd`"
      pricing_incomplete:
        en: "the `[pricing.%{0}]` entry is incomplete; it is ignored"
        zh-CN: "`[pricing.%{0}]` 这一项不完整；已忽略"
      pricing_missing:
