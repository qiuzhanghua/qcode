        zh-CN: 正在启动…
      stopping:
        en: Stopping…
        zh-CN: 正在停止…
    # 状态的一句话说清（`/daemon status` 与无障碍标签共用）。
    state:
      start:
        en: not resident
        zh-CN: 未常驻
      stop:
        en: resident
        zh-CN: 常驻中
      window_driven:
