      start_failed:
        en: "Could not start the scheduled-task driver: %{0}"
        zh-CN: 无法启动定时任务驱动：%{0}
      stopped:
        en: Scheduled-task driver stopped
        zh-CN: 定时任务驱动已停止
      already_gone:
        en: The driver is already gone
        zh-CN: 驱动已经不在了
      stop_failed:
        en: "Could not stop the scheduled-task driver: %{0}"
        zh-CN: 无法停止定时任务驱动：%{0}

# 工具返回值与工具 spec（`qcode-tools` / `qcode-core`）。
#
# 这一层是**结果的展示面**：工具回执会渲进对话，用户直接读；错误也是。按
# ADR-0105 §5 与 I18N.md §2.3 的 C 类处置，跟随 UI 语言。
#
# **spec 的参数描述也在这里，且同样跟随 UI 语言。** 这是有意的、也是有代价的：
# `specs()` 在 `engine/turn.rs` 里**每回合重建**，所以语言切换后下一回合就生效；
# 代价是同一工具调用的 schema 在不同界面语言下字节不同，切换语言那一次会让提示
# 缓存失效，eval 基线要按语言各记一套（§2.3 C 类代价 1–2）。中文界面下模型读到
# 中文参数说明，与顶层 `description`（英文历史包袱）暂时混排 —— 见 I18N.md 遗留项。
tool:
  schedule:
    # 会话没接任务存储时四个工具共用的第一条错误。
    unavailable:
      en: "The scheduled-task service is unavailable: this session has no task store wired up, so no scheduled task can be registered."
      zh-CN: 定时任务服务不可用：当前会话没有接入任务存储（无法登记定时任务）。
    ask:
      title:
        en: Give this scheduled task a name (required, short and distinguishable).
        zh-CN: 给这个定时任务起个名称（必填，简短可区分）。
      prompt:
        en: What should be delivered into the conversation at trigger time (required, equivalent to one user message)?
        zh-CN: 到点后投递给会话的内容是什么（必填，相当于一条用户消息）？
      rule:
        en: Choose a trigger period (required).
        zh-CN: 请选择触发周期（必填）。
      rule_detail:
        en: Pick a type, then fill in its parameters (time / weekday / date / seconds / cron expression).
        zh-CN: 选类型后填对应参数（时刻 / 星期 / 日期 / 秒数 / Cron 表达式）。
      cwd:
        en: Set this scheduled task's working directory (absolute path; may be skipped, then the session default applies).
        zh-CN: 请指定该定时任务的工作目录（绝对路径；可跳过，将使用会话默认目录）
      target:
        en: Where should each delivery go?
        zh-CN: 每次投递到哪里？
      target_detail:
        en: "Two choices: reuse one session, or create a new session each time."
        zh-CN: 二选一：复用同一个会话，或每次新建一个会话。
      # 两个选项 label 兼作 `parse_target` 的输入（见 `tool.schedule.ask.target_*_label`
      # 与 `parse_target` 的比较），所以两处必须取同一条 key，不能各写一份。
      target_reuse_label:
        en: Reuse one session
        zh-CN: 复用同一个会话
      target_reuse_desc:
        en: Every delivery goes into the session that created it (default; in a conversation, the current one).
        zh-CN: 所有投递都进入创建它的这个会话（默认；在对话中创建时即当前对话）。
      target_new_label:
        en: New session each time
        zh-CN: 每次新建一个会话
      target_new_desc:
        en: Every delivery creates a new session.
        zh-CN: 每次投递都新建一个会话。
    error:
      missing_info:
        en: "Missing required information: confirm the scheduled task's name, content and period with the user first (working directory and target are optional), then call schedule_create."
        zh-CN: 缺少必要信息：请先向用户确认该定时任务的名称、内容与周期（工作目录与目标可省略），再调用 schedule_create
      cancelled:
        en: "Creation cancelled: not enough information was provided."
        zh-CN: 创建已取消：未获得完整信息
      title_required:
        en: "The title cannot be empty: the user gave no task name."
        zh-CN: 标题不能为空：用户未提供任务名称
      prompt_required:
        en: "The content cannot be empty: the user gave nothing to deliver."
        zh-CN: 内容不能为空：用户未提供投递内容
      rule_required:
        en: "The period cannot be empty: the user gave no trigger rule."
        zh-CN: 周期不能为空：用户未提供触发周期
      invalid_rule:
        en: "Invalid rule: %{0}"
        zh-CN: "规则无效: %{0}"
      bad_target:
        en: "target must be new_once (reuse one session) / new (a new session each time) / session:<session-id>"
        zh-CN: "target 需为 new_once（每次复用会话）/ new（每次新建会话）/ session:<会话ID>"
      bad_overlap:
        en: overlap must be queue / skip
        zh-CN: overlap 需为 queue / skip
      missing_id:
        en: Missing task id
        zh-CN: 缺少任务 id
      not_found:
        en: "Scheduled task `%{0}` does not exist"
        zh-CN: "定时任务 `%{0}` 不存在"
      unknown_action:
        en: "Unknown action `%{0}`; expected edit / pause / resume / run_now / delete"
        zh-CN: "未知 action `%{0}`，应为 edit / pause / resume / run_now / delete"
    output:
      created:
        en: "Created scheduled task `%{0}` (id: %{1})\n%{2}\n\n%{3}"
        zh-CN: "已创建定时任务 `%{0}`（id: %{1}）\n%{2}\n\n%{3}"
      saved:
        en: "Saved scheduled task `%{0}` (id: %{1})\n%{2}"
        zh-CN: "已保存定时任务 `%{0}`（id: %{1}）\n%{2}"
      paused:
        en: "Paused scheduled task `%{0}`"
        zh-CN: "已暂停定时任务 `%{0}`"
      resumed:
        en: "Resumed scheduled task `%{0}`"
        zh-CN: "已恢复定时任务 `%{0}`"
      ran:
        en: "Triggered scheduled task `%{0}` to run now"
        zh-CN: "已触发定时任务 `%{0}` 立即执行"
      deleted:
        en: "Deleted scheduled task `%{0}`"
        zh-CN: "已删除定时任务 `%{0}`"

  # 工具结果的填空。工具结果跟随会话语言（ADR-0105 §5）。
  shell_result:
    exit_code:
      en: "exit code: %{0}"
      zh-CN: "退出码：%{0}"
    signal:
      en: "signal"
      zh-CN: 信号
  skills_result:
    more_omitted:
      en: "- … %{0} more skill(s) omitted"
      zh-CN: "- … 还有 %{0} 个技能被省略"
    bundled_files:
      en: "## Bundled files"
      zh-CN: "## 捆绑的文件"
    more_files_omitted:
      en: "- … more files omitted"
      zh-CN: "- … 还有文件被省略"
    read_one:
      en: "Read one with skill(name=\"%{0}\", file=\"<path>\")."
      zh-CN: "用 skill(name=\"%{0}\", file=\"<path>\") 读其中一个。"
  truncate:
    bytes:
      en: "… [%{0} bytes truncated] …"
      zh-CN: "… [省略 %{0} 字节] …"
# 驱动状态、审批说明、规则/目标的展示、run 摘要、CLI 追问提示（`qcode-core`）。
#
# **这里刻意不含发给模型的指令**：`title.rs` 的两条会话标题 prompt，以及 `turn.rs`
# 的 `CONTINUE_PROMPT` / `WRAP_UP_PROMPT` / `HAND_OFF_PROMPT`，都保持中文原样。
# 理由见 I18N.md §2.3 B 类：prompt 一翻就改模型行为、毁提示缓存、让 eval 基线漂，
# 而「模型说什么语言」由模型自己按对话内容决定，不由界面语言决定。

  # ---- 工具返回值里用户看得见的固定措辞（ADR-0105 §5）----
  #
  # 只收**结果摘要**：工具做了什么、结果为空、超时、被取消。这些是用户直接看到的
  # 那句话，GUI 里就显示在工具卡片上。
  #
  # 不收的（有意，不是漏）：
  # - 工具 spec 的 description 与参数说明（约 37 条）：发给模型的指令，不是结果面，
  #   统一英文。§10.13 记了为什么。
  # - `ToolError` 的技术诊断（`invalid glob`、`invalid hunk header`、`cannot resolve
  #   path` 等约 14 条）：受众是模型，它要据此改参数；`glob`/`regex`/`hunk`/`UTF-8`
  #   这些词翻成中文反而更难对上。
  # - `exit code: N` / `signal`：shell 约定的技术标记，与 `PWD`、`glob` 同类。
  fs:
    image_returned:
      en: "%{0}: %{1}, %{2} bytes — returned as an image, not as text."
      zh-CN: "%{0}：%{1}，%{2} 字节——以图片返回，不是文本。"
    wrote:
      en: "wrote %{0} bytes to %{1}"
      zh-CN: "已写入 %{0} 字节到 %{1}"
    replaced:
      en: "replaced %{0} occurrence(s) in %{1}"
      zh-CN: "%{1} 中替换了 %{0} 处"
  fetch:
    cancelled:
      en: web_fetch cancelled
      zh-CN: web_fetch 已取消
  web_search:
    cancelled:
      en: web_search cancelled
      zh-CN: web_search 已取消
  search:
    no_matches:
      en: "no matches"
      zh-CN: 没有匹配
  # 引擎与 shell 工具共用：一次工具调用被用户中断时的那句话，概念相同。
  cancelled:
    en: "cancelled by user"
    zh-CN: 用户已取消
  shell:
    timed_out:
      en: "command timed out after %{0}s"
      zh-CN: "命令在 %{0} 秒后超时"
