    status:
      unknown:
        en: Driver state unknown (backend not wired up). Tasks can still be registered and edited, but nothing will fire.
        zh-CN: 驱动状态未知（后端未装配）。任务仍可登记与编辑，但不会触发。
      elsewhere:
        en: The driver is running against another data directory; these tasks will not fire at their time.
        zh-CN: 驱动的跑在别的数据目录上；这些任务到点不会触发。
    notice:
      switching:
        en: Switching; waiting for it to finish.
        zh-CN: 正在切换，等它完成。
      already_running:
        en: The resident driver is already running; no need to start it again.
        zh-CN: 常驻驱动已经在跑了，不用再启动。
      started:
        en: "Scheduled-task driver started (pid %{0})"
        zh-CN: 定时任务驱动已启动（pid %{0}）
      started_waiting:
        en: "Scheduled-task driver started (pid %{0}); waiting for this window to exit before it takes over."
        zh-CN: 定时任务驱动已启动（pid %{0}），正在等这个窗口退出后接手。
      started_preparing:
        en: "Scheduled-task driver started (pid %{0}); getting ready…"
