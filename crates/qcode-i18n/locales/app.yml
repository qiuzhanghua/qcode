        zh-CN: "没有 `[pricing.%{0}]` 这一项；`--max-cost` 停不下来。价格不猜——要么声明费率，要么忽略这一行"
      conn_skipped_mock:
        en: "skipped (mock provider)"
        zh-CN: "跳过（mock 供应商）"
      conn_proxy_failed:
        en: "cannot start egress proxy: %{0}"
        zh-CN: "起不了出网代理：%{0}"
      conn_responded:
        en: "provider responded"
        zh-CN: 供应商有应答
      conn_auth_failed:
        en: "authentication failed: %{0}"
        zh-CN: "认证没过：%{0}"
      conn_invalid_request:
        en: "invalid request: %{0}"
        zh-CN: "请求无效：%{0}"
      conn_timeout:
        en: "timed out after 10s"
        zh-CN: 10 秒后超时
      rustc_version_failed:
        en: "`rustc --version` failed"
        zh-CN: "`rustc --version` 失败"
      rustc_missing:
        en: "not found on PATH (only needed to build)"
        zh-CN: "PATH 上找不到（只在构建时需要）"
      token_details:
        en: "integrity %{0}; restricted sids %{1}"
        zh-CN: "完整性级别 %{0}；受限 SID %{1}"
      temp_fallback:
        en: "%{0}; a sandboxed shell falls back to a temp inside the workspace"
        zh-CN: "%{0}；被沙箱的 shell 会退回到工作区内的临时目录"
      update_disabled:
        en: "disabled; qc never looks for new releases"
        zh-CN: "已关闭；qc 从不查找新版本"
      update_no_cache:
        en: "%{0}; no cached check yet"
        zh-CN: "%{0}；还没有缓存过的检查结果"
      update_available:
        en: "%{0}; %{1} is available (last check %{2}d ago, run `qc update`)"
        zh-CN: "%{0}；有 %{1} 可用（上次检查是 %{2} 天前，跑 `qc update`）"
      update_latest_seen:
        en: "%{0}; latest seen %{1} (last check %{2}d ago)"
        zh-CN: "%{0}；见过的最新是 %{1}（上次检查是 %{2} 天前）"
      update_schedule_days:
        en: "every %{0} day(s)"
        zh-CN: "每 %{0} 天检查一次"
      update_schedule_manual:
        en: "only via `qc update`"
        zh-CN: "只在跑 `qc update` 时检查"
      update_detail:
        en: "current %{0}, checks %{1} (repo %{2})"
        zh-CN: "当前 %{0}，%{1}（仓库 %{2}）"
      update_nothing_found:
        en: "%{0}; last check %{1}d ago found nothing"
        zh-CN: "%{0}；%{1} 天前那次检查什么也没找到"
      net_requires_sandbox_exec:
        en: "requires [sandbox] mode = \"sandbox-exec\" (macOS)"
        zh-CN: "需要 `[sandbox] mode = \"sandbox-exec\"`（macOS）"
      net_requires_proxy:
        en: "requires [network] enabled = true (the proxy is the only allowed destination)"
        zh-CN: "需要 `[network] enabled = true`（代理是唯一被允许的出口）"
      net_proxy_only:
        en: "proxy-only via sandbox-exec; the proxy port is assigned at startup"
        zh-CN: "经 sandbox-exec 只走代理；代理端口在启动时分配"
      sandbox_none_boundary:
        en: "none; approval and workspace path checks are the boundary"
        zh-CN: "无；边界就是审批和路径检查"
      mcp_no_sandbox:
        en: "no sandbox: %{0}"
        zh-CN: "没有沙箱：%{0}"
      mcp_proxy_failed:
        en: "cannot start the egress proxy, remote servers will be skipped: %{0}"
        zh-CN: "起不了出网代理，远程服务器会被跳过：%{0}"
      mcp_probe_ok:
        en: "protocol %{0} · declares tools=%{1} resources=%{2} prompts=%{3} · registered %{4}%{5}"
        zh-CN: "协议 %{0} · 声明 tools=%{1} resources=%{2} prompts=%{3} · 已注册 %{4}%{5}"
      mcp_probe_instructions:
        en: " · instructions %{0} bytes"
        zh-CN: " · instructions %{0} 字节"
      mcp_no_url:
        en: "no url; qcode will skip it"
        zh-CN: "没有 url；qcode 会跳过它"
      mcp_bad_url:
        en: "url %{0} is unusable: %{1}"
        zh-CN: "url %{0} 用不了：%{1}"
      mcp_remote_ok:
        en: "transport streamable-http, %{0}, credentials [bearer %{1}], headers [%{2}], %{3}"
        zh-CN: "传输 streamable-http，%{0}，凭据 [bearer %{1}]，请求头 [%{2}]，%{3}"
      audit_none:
        en: "no proxy, so nothing is audited"
        zh-CN: "没有代理，也就没有审计"
      audit_on:
        en: "audited"
        zh-CN: 已审计
      audit_off:
        en: "not audited ([network] audit = false)"
        zh-CN: "未审计（`[network] audit = false`）"
      mcp_bearer_unset:
        en: "$%{0} is not set in qcode's environment, so this server is skipped"
        zh-CN: "qcode 的环境里没有 $%{0}，所以跳过这个服务器"
      mcp_no_egress:
        en: "[network] enabled = false, so qcode has no egress client and will refuse this server instead of connecting around the proxy"
        zh-CN: "`[network] enabled = false`，所以 qcode 没有出网客户端，会拒绝这个服务器——而不是绕开代理去连"
      mcp_unknown_allow:
        en: "%{0}:%{1} is not in [network] allow, and it will be reached only because [network] unknown = \"allow\""
        zh-CN: "%{0}:%{1} 不在 `[network]` 的 allow 里，它能出去只是因为 `[network] unknown = \"allow\"`"
      mcp_not_allowed:
        en: "%{0}:%{1} is not in [network] allow, so the proxy will answer 403 and this server will contribute no tools; add allow = [\"%{0}:%{1}\"] under [network]"
        zh-CN: "%{0}:%{1} 不在 `[network]` 的 allow 里，代理会回 403，这个服务器不会贡献任何工具；在 `[network]` 下加 `allow = [\"%{0}:%{1}\"]`"
      mcp_path_sampled:
        en: "%{0} (sampled with %{1})"
        zh-CN: "%{0}（用 %{1} 采的样）"
      mcp_path_no_snapshot:
        en: "no shell environment snapshot, so a bare `command` is looked up in qcode's own PATH only; under `qc gui` from the Dock that is launchd's minimal one — use an absolute path, or check `qc shell-env`"
        zh-CN: "没有 shell 环境快照，所以裸 `command` 只在 qcode 自己的 PATH 里找；从 Dock 起 `qc gui` 时那是 launchd 的最小 PATH——写绝对路径，或者看 `qc shell-env`"
      mcp_sandbox_none:
        en: "[sandbox] mode = \"none\": no server is confined, whatever [mcp] sandbox says"
        zh-CN: "`[sandbox] mode = \"none\"`：不管 `[mcp]` 的 sandbox 怎么说，没有服务器被关起来"
      mcp_disabled:
        en: "disabled; skipped at startup"
        zh-CN: "已关闭；启动时跳过"
      mcp_bad_transport:
        en: "sets both or neither of `command` and `url`; qcode will skip it"
        zh-CN: "`command` 和 `url` 要么都设了、要么都没设；qcode 会跳过它"
      mcp_env_literal:
        en: "the value is a literal, so the secret is in the config file; write ${NAME} instead so it is read from qcode's environment"
        zh-CN: "值是个字面量，密钥就躺在配置文件里；写成 ${NAME}，让它从 qcode 的环境里读"
      grant_missing:
        en: "%{0} does not exist; the grant skips it"
        zh-CN: "%{0} 不存在；这条授权会跳过它"
      grant_nothing:
        en: "\"%{0}\" grants nothing on this machine (no %{1})"
        zh-CN: "`%{0}` 在这台机器上什么也没授权（没有 %{1}）"
      sandbox_off_unconfined:
        en: "sandbox = \"off\"; the server is not confined, so it reads and writes whatever your user can"
        zh-CN: "`sandbox = \"off\"`；这个服务器没有被关起来，你的用户能读写的它都能读写"
      key_store_hint_store:
        en: "store it:"
        zh-CN: "存起来："
      key_store_hint_then:
        en: "then:"
        zh-CN: "然后："
      key_store_hint_avoid:
        en: "avoid:"
        zh-CN: "别用："
      key_store_avoid_reason:
        en: ", which puts the key in the command line"
        zh-CN: "，那会把密钥写进命令行"
      acp_ok:
        en: "protocol v%{0} over stdio (`qc acp`)"
        zh-CN: "协议 v%{0}，走 stdio（`qc acp`）"

  session:
    no_sessions:
      en: "no sessions"
      zh-CN: 没有会话
    no_roots:
      en: "    (no roots)"
      zh-CN: "    （没有根目录记录）"
    no_task_record:
      en: "    (no task record)"
      zh-CN: "    （没有任务记录）"
    nothing_to_clean:
      en: "nothing to clean"
      zh-CN: 没有要清理的
    nothing_to_delete:
      en: "nothing to delete"
      zh-CN: 没有要删除的
    dry_run_delete:
      en: "dry run; pass --yes to delete"
      zh-CN: "预演；要真的删除请加 `--yes`"
    dry_run_restore:
      en: "dry run; pass --yes to restore"
      zh-CN: "预演；要真的恢复请加 `--yes`"
    cannot_remove_snapshots:
      en: "cannot remove snapshots for %{0}: %{1}"
      zh-CN: "删不掉 %{0} 的快照：%{1}"
    cannot_sweep_snapshots:
      en: "cannot sweep snapshots: %{0}"
      zh-CN: "清理不了快照：%{0}"
    removed_orphans:
      en: "removed %{0} orphan snapshot tree(s)"
      zh-CN: "清掉了 %{0} 棵无主的快照目录"
    freed:
      en: "freed %{0} MB"
      zh-CN: "释放了 %{0} MB"
    would_delete_n:
      en: "%{0} session(s) would be deleted; pass --yes to delete"
      zh-CN: "会删掉 %{0} 个会话；要真的删除请加 `--yes`"
    deleted_n:
      en: "deleted %{0} session(s)"
      zh-CN: "已删除 %{0} 个会话"
    no_checkpoints_for:
      en: "no checkpoints for %{0}"
      zh-CN: "%{0} 没有检查点"
    turn_files:
      en: "turn %{0}: %{1} file(s)"
      zh-CN: "第 %{0} 轮：%{1} 个文件"
    would_restore:
      en: "would restore %{0} turn(s) into %{1}"
      zh-CN: "会把 %{0} 轮恢复进 %{1}"
    restored:
      en: "restored %{0} file(s), removed %{1} created file(s) (turns %{2})"
      zh-CN: "恢复了 %{0} 个文件，删掉了 %{1} 个新建文件（轮次 %{2}）"
    skipped:
      en: "skipped %{0}"
      zh-CN: "跳过了 %{0}"
    gc_removed:
      en: "removed %{0} (snapshots: %{1} MB)"
      zh-CN: "已删除 %{0}（快照：%{1} MB）"
    gc_would_remove:
      en: "would remove %{0} (snapshots: %{1} MB)"
      zh-CN: "会删除 %{0}（快照：%{1} MB）"
    keychain_hint:
      en: "stored in the keychain; add to your config:"
      zh-CN: "已存进钥匙串；在配置里加上："
    libsecret_hint:
      en: "stored in libsecret; add to your config:"
      zh-CN: "已存进 libsecret；在配置里加上："
    dpapi_hint:
      en: "stored (DPAPI, user-scoped) in %{0}; add to your config:"
      zh-CN: "已存进（DPAPI，用户作用域）%{0}；在配置里加上："

  # ---- P2：clap 的帮助与报错（见 `crates/qcode/src/clap_i18n.rs`）----
  #
  # 与其它段的根本区别：**这些键是拼出来的**，不是字面量。`clap_i18n::localize`
  # 遍历命令树，按路径查 `cli.cmd.<命令路径>.about` / `.long_about` /
  # `.arg.<参数id>.help`，所以静态扫描（门禁 4/6）看不见它们；另配一道可达性
  # 门禁（`crates/qcode/src/cli_i18n_gate.rs`）遍历真实的 `Command` 树证明覆盖。
  #
  # **不翻的东西**（翻了会破坏契约或让人按不出来）：命令名、参数名、值名
  # （`DATA_DIR`）、路径、`cron <expr>`、`YYYY-MM-DD HH:MM`、`[agent] max_turns`、
  # `ADR-00xx`、`$EDITOR`、`new_once`、`queue`/`skip`、`schema-2`、`config.toml`、
  # `run_shell`。它们原样留在中文句子里。
  #
  # `cli.label.*` 是 clap **内置**的标签（`Usage:` / `Options:` / `Print help` …）：
  # 硬编码在 clap_builder 里、没有任何 API 可配，只能等渲染成文本后按规则表改写。
  # 规则表在代码里（它是 clap 的契约），译文在这里。
  label:
    usage:
      en: "Usage:"
      zh-CN: "用法："
    commands:
      en: "Commands:"
      zh-CN: "命令："
    options:
      en: "Options:"
      zh-CN: "选项："
    arguments:
      en: "Arguments:"
      zh-CN: "参数："
    print_help_full:
      en: "Print this message or the help of the given subcommand(s)"
      zh-CN: "打印本帮助或指定子命令的帮助"
    print_version:
      en: "Print version"
      zh-CN: "打印版本"
    print_help:
      en: "Print help"
      zh-CN: "打印帮助"
    error_prefix:
      en: "error: "
      zh-CN: "错误："
    tip_prefix:
      en: "tip: "
      zh-CN: "提示："
    more_info:
      en: "For more information, try '--help'."
      zh-CN: "更多信息请试 '--help'。"
    unexpected_argument:
      en: "unexpected argument '{}' found"
      zh-CN: "未识别的参数 '{}'"
    unrecognized_subcommand:
      en: "unrecognized subcommand '{}'"
      zh-CN: "未识别的子命令 '{}'"
  # 帮助正文。键 = 命令树路径，逐级嵌套（`schedule.create` 即 `qc schedule create`）。
  cmd:
    top:
      about:
        en: "qc - coding agent"
        zh-CN: "qc - 编程助手"
      arg:
        data_dir:
          help:
            en: "Data directory. Defaults to the XDG data home"
            zh-CN: "数据目录。默认取 XDG 数据目录"
        config:
          help:
            en: "Config file. Defaults to ~/.config/qcode/config.toml"
            zh-CN: "配置文件。默认 ~/.config/qcode/config.toml"
        approval_policy:
          help:
            en: "Approval policy file ([[rules]]). Replaces the config's approval rules"
            zh-CN: "审批策略文件（[[rules]]）。会替换配置文件里的审批规则"
    tui:
      about:
        en: "Start the interactive terminal UI"
        zh-CN: "启动交互式终端界面"
      long_about:
        en: "Start the interactive terminal UI.\n\nADR-0089: this used to be what bare `qc` did. It is a subcommand now because typing `qc` by accident must not take over the terminal — and because \"which frontend\" is a choice the user makes, not one inferred from the fact that a terminal exists."
        zh-CN: "启动交互式终端界面。\n\nADR-0089：这原本是裸 `qc` 的行为。现在它是一个子命令：不小心敲下 `qc` 不该就此接管终端——而且「用哪个前端」是用户的选择，不该因为「有终端」就替他推定。"
    run:
      about:
        en: "Run a single headless turn"
        zh-CN: "跑一个无界面的回合"
      arg:
        prompt:
          help:
            en: "Prompt text. Read from stdin when omitted"
            zh-CN: "提示文本。省略时从 stdin 读"
        skill:
          help:
            en: "Activate a discovered skill by prepending its instructions to the prompt"
            zh-CN: "激活一个已发现的技能：把它的说明前置到提示里"
        json:
          help:
            en: "Emit the event stream as JSONL on stdout"
            zh-CN: "把事件流以 JSONL 写到 stdout"
        include_raw:
          help:
            en: "Include provider_raw in --json output (hidden by default)"
            zh-CN: "在 --json 输出里带上 provider_raw（默认隐藏）"
        provider:
          help:
            en: "Provider name: mock, openai, deepseek, ollama, or a custom entry"
            zh-CN: "供应商名：mock、openai、deepseek、ollama，或配置里自定义的条目"
        base_url:
          help:
            en: "Override the provider base URL"
            zh-CN: "覆盖供应商的 API 地址"
        no_stream_usage:
          help:
            en: "Do not ask the server for a usage chunk"
            zh-CN: "不向服务端索取用量分片"
        max_turns:
          help:
            en: "Maximum model calls for this turn. Defaults to [agent] max_turns (8 unless the config says otherwise)"
            zh-CN: "本回合的模型调用上限。默认取 [agent] max_turns（配置没写就是 8）"
        yes:
          help:
            en: "Auto-approve anything the policy marks as ask"
            zh-CN: "策略标为「询问」的一律自动放行"
        cwd:
          help:
            en: "Workspace root for tools. Defaults to the current directory"
            zh-CN: "工具的工作区根目录。默认当前目录"
        resume:
          help:
            en: "Resume an existing session instead of creating a new one"
            zh-CN: "接着已有会话跑，而不是新建一个"
        max_cost:
          help:
            en: "Stop once the estimated cost exceeds this many USD. Requires a [pricing.\"<model>\"] entry in the config file"
            zh-CN: "估算成本超过这么多美元就停。需要配置文件里有 [pricing.\"<model>\"] 条目"
        image:
          help:
            en: "Attach an image (PNG/JPEG/WebP/GIF) to this message. Repeatable; needs a provider that accepts images"
            zh-CN: "给这条消息附一张图（PNG/JPEG/WebP/GIF）。可重复；供应商要支持图片"
        file:
          help:
            en: "Attach a file of any type. The bytes go into the attachment store and the model reads a handle, not the contents. Repeatable"
            zh-CN: "附一个任意类型的文件。字节进附件库，模型读到的是句柄而不是内容。可重复"
        timeout:
          help:
            en: "Whole-turn wall-clock limit in seconds. On expiry the turn is cancelled (same path as Ctrl-C, including process-group cleanup) and qc exits 124"
            zh-CN: "整轮的墙钟上限（秒）。到点取消这一轮（与 Ctrl-C 同一条路径，含进程组清理），qc 以 124 退出"
        continue_:
          help:
            en: "Continue a paused turn (`--resume <id>`) without retyping the task. With `--raise-turns`/`--raise-cost`, the new limits apply to this window only"
            zh-CN: "接着一个暂停的回合继续（配合 `--resume <id>`），不必重打任务。配上 `--raise-turns`/`--raise-cost` 时，新上限只对这一窗生效"
        raise_turns:
          help:
            en: "Turns for this continuation window (implies --continue)"
            zh-CN: "这一续跑窗的轮数（隐含 --continue）"
        raise_cost:
          help:
            en: "Cost ceiling for this continuation window (implies --continue)"
            zh-CN: "这一续跑窗的成本上限（隐含 --continue）"
        raise_persist:
          help:
            en: "Also write the raised limit to config.toml, so the next session keeps it. Needs --raise-turns or --raise-cost"
            zh-CN: "把调高的上限也写进 config.toml，下次会话沿用。需要 --raise-turns 或 --raise-cost"
    resume:
      about:
        en: "Resume a stored session in the TUI"
        zh-CN: "在 TUI 里接着一个已存的会话"
      arg:
        id:
          help:
            en: "Session id to resume"
            zh-CN: "要接着跑的会话 id"
    sessions:
      about:
        en: "Inspect persisted sessions"
        zh-CN: "查看已落盘的会话"
      list:
        about:
          en: "List stored sessions, newest first"
          zh-CN: "列出已存的会话，最新的在前"
        arg:
          titles:
            help:
              en: "Also print the title the sidebar shows for each session"
              zh-CN: "同时打印侧栏给每个会话显示的那个标题"
      show:
        about:
          en: "Replay one session as JSON"
          zh-CN: "把一个会话按 JSON 重放出来"
      fork:
        about:
          en: "Copy a conversation prefix into a new session"
          zh-CN: "把一段对话前缀复制成一个新会话"
        arg:
          at:
            help:
              en: "Fork after this event seq (default: the whole session)"
              zh-CN: "在这个事件序号之后分叉（默认：整个会话）"
      gc:
        about:
          en: "Remove sessions whose last event is older than N days"
          zh-CN: "删掉最后一个事件早于 N 天的会话"
        arg:
          yes:
            help:
              en: "Actually delete; without it, only print candidates"
              zh-CN: "真的删；不加就只列出候选"
      delete:
        about:
          en: "Remove one or more sessions by id"
          zh-CN: "按 id 删掉一个或多个会话"
        long_about:
          en: "Remove one or more sessions by id.\n\n`gc` can only drop by age, which does not help when a batch of runs polluted the store and the real work is interleaved with it."
          zh-CN: "按 id 删掉一个或多个会话。\n\n`gc` 只能按年龄删，而「一批跑批把库弄脏了、真正的工作夹在中间」这种情况它帮不上忙。"
        arg:
          ids:
            help:
              en: "Session ids to remove. With `--except`, the ids to keep"
              zh-CN: "要删的会话 id。配上 `--except` 时变成要保留的 id"
          except:
            help:
              en: "Treat `ids` as the sessions to keep and delete every other one"
              zh-CN: "把 `ids` 当作要保留的，其余全部删掉"
          keep_title:
            help:
              en: "Keep the sessions shown under these titles in the sidebar"
              zh-CN: "保留侧栏里显示为这些标题的会话"
          yes:
            help:
              en: "Actually delete; without it, only print what would go"
              zh-CN: "真的删；不加就只列出会删掉哪些"
      checkpoints:
        about:
          en: "List the checkpoints (file pre-images) a session recorded"
          zh-CN: "列出一个会话记下的检查点（文件改动前的快照）"
      rollback:
        about:
          en: "Put the workspace back to the state before a turn"
          zh-CN: "把工作区退回到某一轮之前的状态"
        arg:
          to:
            help:
              en: "Turn to roll back to: files are restored to their state before it"
              zh-CN: "退回到哪一轮：文件恢复成那一轮之前的样子"
          yes:
            help:
              en: "Restore without asking for confirmation"
              zh-CN: "不确认直接恢复"
    schedule:
      about:
        en: "Manage scheduled tasks (ADR-0090)"
        zh-CN: "管理定时任务（ADR-0090）"
      list:
        about:
          en: "List scheduled tasks"
          zh-CN: "列出定时任务"
        arg:
          all:
            help:
              en: "Include paused and ended tasks. `--json` is always exhaustive"
              zh-CN: "连暂停与已结束的也列出来。`--json` 恒为全量"
          json:
            help:
              en: "Machine-readable output. This shape is the stable contract; the text form is not"
              zh-CN: "机器可读输出。这个形状才是稳定契约，文字形态不是"
      create:
        about:
          en: "Create a scheduled task"
          zh-CN: "创建一条定时任务"
        arg:
          title:
            help:
              en: "Short, distinguishable name"
              zh-CN: "简短、可区分的名称"
          prompt:
            help:
              en: "What gets delivered when it fires — sent verbatim as a user message"
              zh-CN: "到点投递的内容：原样作为一条用户消息送出"
          rule:
            help:
              en: "cron <expr> | once YYYY-MM-DD HH:MM | every <secs> (>=60) | daily HH:MM | weekly <days> HH:MM | monthly <day> HH:MM"
              zh-CN: "cron <expr> | once YYYY-MM-DD HH:MM | every <秒> (>=60) | daily HH:MM | weekly <星期> HH:MM | monthly <日> HH:MM"
          target:
            help:
              en: "new_once (default) | new | session:<id>"
              zh-CN: "new_once（默认）| new | session:<id>"
          cwd:
            help:
              en: "Where the delivered turn runs. Defaults to the current directory, stored absolute — a filesystem root falls back to your home directory, because `/` cannot be a sandbox root"
              zh-CN: "投递的回合在哪里跑。默认当前目录，存成绝对路径；文件系统根会回落到你的家目录，因为 `/` 不能当沙箱根"
          overlap:
            help:
              en: "queue (default) | skip"
              zh-CN: "queue（默认）| skip"
          approval_timeout_secs:
            help:
              en: "Deny the delivered turn's approvals after this many seconds; omit to wait for a human"
              zh-CN: "投递回合的审批超过这么多秒就拒绝；省略则一直等人工"
          json:
            help:
              en: "Machine-readable output: the created task plus the driver state"
              zh-CN: "机器可读输出：创建出来的任务加上驱动状态"
      delete:
        about:
          en: "Delete a scheduled task by id"
          zh-CN: "按 id 删除一条定时任务"
    daemon:
      about:
        en: "Start, stop or inspect the scheduled-task daemon (ADR-0092)"
        zh-CN: "启动、停止或查看定时任务的常驻驱动（ADR-0092）"
      start:
        about:
          en: "Start the daemon in the background"
          zh-CN: "在后台启动常驻驱动"
        arg:
          beat:
            help:
              en: "Clock beat in seconds (default 30)"
              zh-CN: "时钟节拍（秒，默认 30）"
      stop:
        about:
          en: "Stop the running daemon"
          zh-CN: "停掉正在跑的常驻驱动"
      status:
        about:
          en: "Report whether a daemon is running, and for which data directory"
          zh-CN: "报告常驻驱动有没有在跑，服务的是哪个数据目录"
        arg:
          json:
            help:
              en: "Machine-readable output"
              zh-CN: "机器可读输出"
    skills:
      about:
        en: "Inspect discovered Agent Skills"
        zh-CN: "查看已发现的 Agent 技能"
      list:
        about:
          en: "List discovered skills and the roots that were checked"
          zh-CN: "列出已发现的技能，以及查过哪些根目录"
    logs:
      about:
        en: "Show where the log file is, and its most recent lines (ADR-0077)"
        zh-CN: "显示日志文件在哪，以及它最近几行（ADR-0077）"
      arg:
        path_only:
          help:
            en: "Print the path and the file listing, but no log lines"
            zh-CN: "只打印路径与文件列表，不打印日志行"
        lines:
          help:
            en: "How many trailing lines to show"
            zh-CN: "显示末尾多少行"
        follow:
          help:
            en: "Keep printing new lines as they are written (Ctrl-C to stop)"
            zh-CN: "边写边打（Ctrl-C 停止）"
        grep:
          help:
            en: "Show only lines matching this regular expression"
            zh-CN: "只显示匹配这个正则的行"
        since:
          help:
            en: "Drop lines older than this: a duration (`30m`, `2h`, `7d`, bare seconds) or an RFC 3339 timestamp"
            zh-CN: "丢掉早于此刻的行：一个时长（`30m`、`2h`、`7d`、纯秒数）或 RFC 3339 时间戳"
    config:
      about:
        en: "Show or edit the config file"
        zh-CN: "显示或编辑配置文件"
      show:
        about:
          en: "Print the effective (merged) configuration"
          zh-CN: "打印生效的（合并后的）配置"
      edit:
        about:
          en: "Open the user config in $EDITOR"
          zh-CN: "用 $EDITOR 打开用户配置"
      migrate:
        about:
          en: "Rewrite a v1 file into the schema-2 shape (ADR-0065): fold `[providers.*].default_model` into `[default-model]`, collapse model tables that only carry an id, and switch `version` to `schema`"
          zh-CN: "把 v1 文件改写成 schema-2 的形状（ADR-0065）：把 `[providers.*].default_model` 并进 `[default-model]`，把只带一个 id 的模型表收掉，并把 `version` 换成 `schema`"
      key:
        about:
          en: "Store an API key in the platform key store (ADR-0039)"
          zh-CN: "把 API 密钥存进系统钥匙串（ADR-0039）"
        set:
          about:
            en: "Read the key from stdin and store it, then print the config line"
            zh-CN: "从 stdin 读密钥存进去，然后打印那行配置"
          arg:
            provider:
              help:
                en: "Config provider name, e.g. deepseek"
                zh-CN: "配置里的供应商名，例如 deepseek"
            service:
              help:
                en: "Key store service name"
                zh-CN: "钥匙串里的服务名"
            account:
              help:
                en: "Account name inside the service"
                zh-CN: "服务里的账户名"
      init:
        about:
          en: "Generate a config file from a built-in template (ADR-0104)"
          zh-CN: "按内置模板生成一个配置文件（ADR-0104）"
        long_about:
          en: "Generate a config file from a built-in template (ADR-0104).\n\nThe template is scaffolding, not an overlay: it is read once, writes an ordinary `config.toml`, and never participates in loading afterwards."
          zh-CN: "按内置模板生成一个配置文件（ADR-0104）。\n\n模板只是脚手架，不是叠加层：它只被读一次，写出一份普通的 `config.toml`，此后完全不参与加载。"
        arg:
          template:
            help:
              en: "Template id, e.g. `security-landlock`, `security/landlock`, or a bare `landlock` when it names exactly one template"
              zh-CN: "模板 id，例如 `security-landlock`、`security/landlock`；只指一个模板时也可以只写 `landlock`"
          force:
            help:
              en: "Overwrite an existing config file (prints a diff first)"
              zh-CN: "覆盖已存在的配置文件（先打印差异）"
    template:
      about:
        en: "List available config templates (ADR-0104)"
        zh-CN: "列出可用的配置模板（ADR-0104）"
      list:
        about:
          en: "List available templates (built-in and user), with their platform"
          zh-CN: "列出可用模板（内置与用户自备），连同它们适用的平台"
    mcp:
      about:
        en: "Manage configured MCP servers"
        zh-CN: "管理已配置的 MCP 服务器"
      list:
        about:
          en: "List configured servers"
          zh-CN: "列出已配置的服务器"
      add:
        about:
          en: "Append a server to the user config"
          zh-CN: "往用户配置里追加一个服务器"
        arg:
          command:
            help:
              en: "Stdio transport: the program to start"
              zh-CN: "stdio 传输：要启动的程序"
          url:
            help:
              en: "Streamable HTTP transport: the endpoint URL (ADR-0067)"
              zh-CN: "streamable HTTP 传输：端点 URL（ADR-0067）"
          bearer_token_env:
            help:
              en: "Name of the environment variable holding the bearer token. The token itself is never written to the config file"
              zh-CN: "存放 bearer token 的环境变量名。token 本身永远不写进配置文件"
          headers:
            help:
              en: "Extra request header, `Name: value`. Repeatable. Sensitive names (authorization, cookie, token, key, secret, password) are refused: use `--bearer-token-env`"
              zh-CN: "额外的请求头，`Name: value`。可重复。敏感名字（authorization、cookie、token、key、secret、password）会被拒收：请用 `--bearer-token-env`"
          args:
            help:
              en: "Repeatable: one argument for the server command"
              zh-CN: "可重复：服务器命令的一个参数"
          disabled:
            help:
              en: "Add the server but leave it disabled"
              zh-CN: "加进来但先停用"
          read_paths:
            help:
              en: "Extra read+execute root, beyond the ones derived from `command` (ADR-0066). Repeatable"
              zh-CN: "额外的读+执行根目录，在从 `command` 推导出的那些之外（ADR-0066）。可重复"
          writable_paths:
            help:
              en: "Extra writable root, beyond the workspace and the server's private HOME. Repeatable"
              zh-CN: "额外的可写根目录，在工作区与服务器私有 HOME 之外。可重复"
          credentials:
            help:
              en: "Credential subtree under `$HOME` the server may read: `github`, `aws`, `ssh`, `npm`, `netrc` or `docker`. Repeatable"
              zh-CN: "允许服务器读取的 `$HOME` 下凭据子树：`github`、`aws`、`ssh`、`npm`、`netrc` 或 `docker`。可重复"
          sandbox:
            help:
              en: "`confine` (default) or `off`; `off` runs this server without an OS sandbox and makes `qc doctor` mark it"
              zh-CN: "`confine`（默认）或 `off`；`off` 让这个服务器不带系统沙箱运行，`qc doctor` 会标出来"
      remove:
        about:
          en: "Remove a server by name"
          zh-CN: "按名字移除一个服务器"
    doctor:
      about:
        en: "Diagnose configuration, credentials and data directory"
        zh-CN: "诊断配置、凭据与数据目录"
      arg:
        probe:
          help:
            en: "Connect to every MCP server and compare what it declares in the handshake with what it actually answers (ADR-0068 §4)"
            zh-CN: "连上每一个 MCP 服务器，把它在握手里声明的东西和它实际答的对比（ADR-0068 §4）"
    shell-env:
      about:
        en: "Show the shell environment `run_shell` would see (ADR-0064)"
        zh-CN: "显示 `run_shell` 会看到的 shell 环境（ADR-0064）"
      arg:
        full:
          help:
            en: "Print variable values too. Refused when stdout is not a terminal"
            zh-CN: "连变量值一起打印。stdout 不是终端时拒绝"
        json:
          help:
            en: "Machine-readable output: one JSON object, values included only with --full"
            zh-CN: "机器可读输出：一个 JSON 对象，只有加 --full 才带值"
    update:
      about:
        en: "Check for a newer release, or install it"
        zh-CN: "检查有没有新版本，或者装上它"
      arg:
        check:
          help:
            en: "Only report whether a newer release exists"
            zh-CN: "只报告有没有新版本"
        yes:
          help:
            en: "Install without asking for confirmation (required when not on a TTY)"
            zh-CN: "不确认直接安装（不在 TTY 上时必须加）"
        install_to:
          help:
            en: "Install to this path instead of the running binary (packaging, tests)"
            zh-CN: "装到这个路径而不是正在跑的那个二进制（打包、测试用）"
    acp:
      about:
        en: "Serve the Agent Client Protocol over stdio (for editors)"
        zh-CN: "通过 stdio 提供 Agent Client Protocol（给编辑器用）"
    # Windows-only，且是**可见**命令（`qc --help` 在 Windows 上会列出它）。
    # 另三个 Windows 内部命令（`sandbox-probe` / `sandbox-run` / `whoami`）是 hidden，
    # 用户看不到，**有意留英文**——门禁 7 只要求可见项有译文。
    sandbox:
      about:
        en: "Inspect or repair the Windows ACL sandbox grants"
        zh-CN: "查看或修复 Windows ACL 沙箱的授权"
      grant:
        about:
          en: "Give the sandbox write access to a directory tree"
          zh-CN: "给沙箱某个目录树的写权限"
        arg:
          path:
            help:
              en: "Directory to grant. Defaults to the current directory"
              zh-CN: "要授权的目录。默认当前目录"
      revoke:
        about:
          en: "Remove a grant from a directory tree"
          zh-CN: "撤掉某个目录树的授权"
        arg:
          path:
            help:
              en: "Directory to revoke. Defaults to the current directory"
              zh-CN: "要撤权的目录。默认当前目录"
  schedule:
    created:
      en: "Created scheduled task `%{0}` (id: %{1})"
      zh-CN: "已创建定时任务 `%{0}`（id: %{1}）"
    deleted:
      en: "Deleted scheduled task %{0}"
      zh-CN: "已删除定时任务 %{0}"
    delete_failed:
      en: "Delete failed: %{0}"
      zh-CN: "删除失败：%{0}"
    # `qc schedule create` 里回显工作目录：默认是「你当时站的地方」，任务在别处
    # 触发正是这一行要防的意外。
    cwd:
      en: "Working directory: %{0}"
      zh-CN: "目录：%{0}"
    cwd_not_a_dir:
      en: "--cwd %{0} is not a directory"
      zh-CN: "--cwd %{0} 不是一个目录"
    fs_root_note:
      en: "note: %{0} is the filesystem root; the task will run in %{1}"
      zh-CN: "note: %{0} 是文件系统根；任务将在 %{1} 里跑"
  daemon:
    running:
      en: "daemon: **running** (one per user)"
      zh-CN: "daemon：**在跑**（一个用户一个）"
    not_running:
      en: "daemon: not running"
      zh-CN: "daemon：没有在跑"
    unknown:
      en: "daemon: **cannot tell** (%{0})"
      zh-CN: "daemon：**无法判断**（%{0}）"
    data_dir:
      en: "Data directory: %{0}"
      zh-CN: "数据目录：%{0}"
    served_elsewhere_note:
      en: "    (it may serve **another** data directory; the lock only answers \"someone is there\", not \"who\")"
      zh-CN: "    （它可能服务**另一个**数据目录；锁只回答「有人」，不回答「是谁」）"
    # `status` 那几条在上面（`cli.daemon.running` / `.not_running` …）。这里只放
    # `start` / `stop`。两者措辞不同不是疏漏：`status` 报的是状态，`stop` 报的是
    # 一次动作的结果，前缀本来就不一样。
    start:
      already_running:
        en: "qc daemon: already running (one daemon per user, ADR-0092 §5).\nIt may serve a different data directory; which one cannot be read from the lock."
        zh-CN: "qc daemon：已经在跑了（一个用户一个 daemon，ADR-0092 §5）。\n它可能服务的是另一个数据目录；具体是哪个，从锁里读不出来。"
      find_failed:
        en: "qc daemon: %{0}"
        zh-CN: "qc daemon：%{0}"
      cannot_start:
        en: "qc daemon: cannot start %{0}: %{1}"
        zh-CN: "qc daemon：无法启动 %{0}：%{1}"
      ok:
        en: "qcd started (pid %{0}) — driving %{1}"
        zh-CN: "qcd 已启动（pid %{0}）——正在驱动 %{1}"
      logs:
        en: "Logs: %{0}"
        zh-CN: "日志：%{0}"
      unverified:
        en: "qc daemon: qcd was spawned (pid %{0}) but its state cannot be verified (%{1}).\nThe lock mechanism is unavailable, so a running daemon would be invisible here.\nIt is most likely running; check `ps -p %{0}` or the log: %{2}"
        zh-CN: "qc daemon：qcd 已经起来了（pid %{0}），但它的状态无法确认（%{1}）。\n锁机制不可用，所以一个正在跑的 daemon 在这里是看不见的。\n它多半在跑；查 `ps -p %{0}` 或日志：%{2}"
      no_lock:
        en: "qc daemon: qcd was spawned (pid %{0}) but did not take the driver lock within 3s.\nIt probably exited at startup; see %{1}"
        zh-CN: "qc daemon：qcd 已经起来了（pid %{0}），但 3 秒内没拿到驱动锁。\n它多半在启动时就退出了；见 %{1}"
    stop:
      not_running:
        en: "qc daemon: not running."
        zh-CN: "qc daemon：没有在跑。"
      stopped:
        en: "qc daemon: stopped."
        zh-CN: "qc daemon：已停止。"
      stuck:
        en: "qc daemon: it acknowledged the stop but is still running after 5s.\nIt may be finishing a turn; check `qc daemon status` again."
        zh-CN: "qc daemon：它确认了停止，但 5 秒后还在跑。\n可能正在收尾一个回合；过一会儿再 `qc daemon status`。"
      wedged:
        en: "qc daemon: the lock is held but nothing answers on the control channel.\nThat process is wedged or shutting down. Wait, or kill it by pid."
        zh-CN: "qc daemon：锁被占着，但控制通道上没人应答。\n那个进程要么卡住了、要么正在退出。等一会儿，或者按 pid 杀掉。"
      cannot_send:
        en: "qc daemon: cannot send the stop request: %{0}"
        zh-CN: "qc daemon：无法发出停止请求：%{0}"
      cannot_tell:
        en: "qc daemon: cannot tell whether it is running (%{0})."
        zh-CN: "qc daemon：判断不出它是否在跑（%{0}）。"
  # `qc update` 的输出。**`warning:` 也一起翻**（`警告：`）：先前这里只翻警告的
  # 尾巴、主干留英文，于是同一行读起来是「warning: 无法…」——半英文半中文，
  # 正是 ADR-0105 §9 不变量 5 禁止的。现在整行一个键。
  update:
    current_version:
      en: "current version: %{0} (%{1})"
      zh-CN: "当前版本：%{0}（%{1}）"
    no_release:
      en: "no published release for %{0} yet"
      zh-CN: "%{0} 还没有发布任何版本"
    latest:
      en: "latest release:  %{0}"
      zh-CN: "最新发布：  %{0}"
    up_to_date:
      en: "qcode is up to date"
      zh-CN: "qcode 已是最新版本"
    available:
      en: "update available: %{0} -> %{1} (run `qc update` to install)"
      zh-CN: "有可用更新：%{0} → %{1}（跑 `qc update` 安装）"
    downloading:
      en: "downloading %{0}"
      zh-CN: "正在下载 %{0}"
    updated:
      en: "updated to %{0} (previous binary: %{1})"
      zh-CN: "已更新到 %{0}（原二进制：%{1}）"
    installed:
      en: "installed %{0} at %{1}"
      zh-CN: "已安装 %{0} 到 %{1}"
    daemon_updated:
      en: "daemon updated: %{0}"
      zh-CN: "daemon 已更新：%{0}"
    warn_no_binary:
      en: "warning: this release publishes no %{0} binary.\n        %{1}"
      zh-CN: "警告：这次发布没有提供 %{0} 二进制。\n        %{1}"
    warn_missing_sum:
      en: "warning: %{0} is missing from SHA256SUMS; not installing the daemon.\n        Unverified bytes next to `qc` is worse than a stale daemon."
      zh-CN: "警告：SHA256SUMS 里没有 %{0}，不装 daemon。\n        放在 `qc` 旁边的未校验字节，比一个旧 daemon 更糟。"
    warn_cannot_download:
      en: "warning: cannot download %{0}: %{1}"
      zh-CN: "警告：无法下载 %{0}：%{1}"
    warn_verify_failed:
      en: "warning: %{0} failed verification (expected %{1}, got %{2}); kept the existing daemon"
      zh-CN: "警告：%{0} 校验没过（期望 %{1}，实际 %{2}）；保留了现有的 daemon"
    warn_cannot_install:
      en: "warning: cannot install %{0}: %{1}\n        %{2}"
      zh-CN: "警告：无法安装 %{0}：%{1}\n        %{2}"
    warn_cannot_run:
      en: "warning: cannot run %{0} --version: %{1}\n        %{2}"
      zh-CN: "警告：跑不了 %{0} --version：%{1}\n        %{2}"
    warn_version_failed:
      en: "warning: %{0} --version failed (%{1}); the installed daemon predates version reporting.\n        %{2}"
      zh-CN: "警告：%{0} --version 失败（%{1}）；装着的 daemon 太旧，还不报版本。\n        %{2}"
    warn_mismatch:
      en: "warning: %{0} reports %{1}, expected %{2}\n        %{3}"
      zh-CN: "警告：%{0} 报的是 %{1}，期望 %{2}\n        %{3}"
    no_daemon_binary_hint:
      en: Scheduled tasks need it (`qc daemon start`); if %{0} already exists, the old version still works.
      zh-CN: 定时任务需要它（`qc daemon start`）；若 %{0} 已存在则仍可用旧版本。
    install_retry_hint:
      en: Run `qc update` again after `qc daemon stop`, or let the next install overwrite it.
      zh-CN: "`qc daemon stop` 之后再跑一次 `qc update`，或在下次安装时覆盖。"
    cannot_run_hint:
      en: The `qc` beside it is already updated; scheduled tasks need this file to be executable.
      zh-CN: 旁边的 qc 已经更新；定时任务需要这个文件能执行。
    no_version_output_hint:
      en: It still runs, it just cannot be checked against.
      zh-CN: 它仍能跑，只是这样对不了账。
    version_mismatch_hint:
      en: The binary installed is not the daemon from this release. The old one still runs (the protocol did not change), but the versions no longer line up.
      zh-CN: 装上去的不是这次发布的 daemon。旧的仍能跑（协议没变），但版本口径不一致。
    nothing_reported:
      en: nothing
      zh-CN: （空）

  # TUI 的状态行提示（进入时会话时推一条 notice）。键位与斜杠命令**不翻译**：
  # 它们是要用户照着按的字面量，翻了就按不出来。
  tui:
    new_session_hint:
      en: "session %{0} · Enter sends (queued while running) · Ctrl-S push · Ctrl-N newline · Esc cancel · Ctrl-O expand · Ctrl-B sub-groups · Ctrl-T ctx display · ↑/↓ or Ctrl-U/D scroll · /skills skills · /queue queue · /steer <n> push · /drop <n> drop · /steering pending injection · /unsteer <n> retract · /checkpoint checkpoint · /rollback <turn> · Ctrl-V paste image · /exit quit · Ctrl-C twice quits"
      zh-CN: "session %{0} · Enter 发送（运行中排队）· Ctrl-S 推送 · Ctrl-N 换行 · Esc 取消 · Ctrl-O 展开 · Ctrl-B 子组 · Ctrl-T ctx 显示 · ↑/↓ 或 Ctrl-U/D 滚动 · /skills 技能 · /queue 队列 · /steer <n> 推送 · /drop <n> 删除 · /steering 等待注入 · /unsteer <n> 撤回 · /checkpoint 检查点 · /rollback <turn> · Ctrl-V 粘贴图片 · /exit 退出 · Ctrl-C 两次退出"
    resumed_hint:
      en: "resumed session %{0} (%{1} events) · Enter sends (queued while running) · Ctrl-S push · Ctrl-N newline · Esc cancel · Ctrl-O expand · Ctrl-B sub-groups · Ctrl-T ctx display · ↑/↓ or Ctrl-U/D scroll · /subagents sub-groups · /checkpoint checkpoint · /rollback <turn> · Ctrl-V paste image · /exit quit · Ctrl-C twice quits"
      zh-CN: "resumed session %{0} (%{1} events) · Enter 发送（运行中排队）· Ctrl-S 推送 · Ctrl-N 换行 · Esc 取消 · Ctrl-O 展开 · Ctrl-B 子组 · Ctrl-T ctx 显示 · ↑/↓ 或 Ctrl-U/D 滚动 · /subagents 子组 · /checkpoint 检查点 · /rollback <turn> · Ctrl-V 粘贴图片 · /exit 退出 · Ctrl-C 两次退出"
  config:
    # `--force` 写出「本平台不适用」的模板时，写进文件头部的那两行注释。
    # 换行放在 key 里：这两行是一个整体（说明 + 已写出的后果），拆开翻译容易漏。
    unsupported_template_notice:
      en: "# Not available on this platform: this template declares %{0}, the current platform is %{1}.\n# The file was written anyway because of --force; the local sandbox backend may fail to assemble."
      zh-CN: "# 本平台不可用：这份模板声明属于 %{0}，当前平台是 %{1}。\n# 文件已用 --force 写出；本机的沙箱后端可能无法装配。"

# `qcode-kernel`：协议标签与 mock provider 的脚本化响应。
#
# **厂商产品名不在这里，也不该翻。** `CatalogEntry.display_name` 里的
# `智谱 Coding` / `通义 Token Plan` / `蚂蚁 Ling` / `小米 MiMo` 是**产品的名字**，
# 与 `Anthropic` 一样属于专有名词：英文界面上写「小米 MiMo」才是对的，写成
# "Xiaomi MiMo" 反而是在替厂商改名。这 4 条会**永久留在门禁 2 的基线里**——基线
# 只能表达「还存在」，不能表达「故意留着」，所以理由写在 `catalog.rs` 的字段注释里。
kernel:
  protocol:
    # 兼容性描述，不是厂商名，所以要翻。
    openai_compat:
      en: OpenAI-compatible
      zh-CN: OpenAI 兼容
  # mock provider 的脚本化响应（`provider_registry.rs`）。
  #
  # 这些是**假模型说的话**，会原样进对话，所以跟 UI 语言走（按 C 类处置）。
  # 代价：`crates/qcode/tests/` 里 5 个端到端测试断言这些字符串，必须钉 `zh-CN`
  # （`QCODE_LANG`），否则机器语言一变就红——那不变量 5 已经要求的事。
  mock:
    approval:
      ask:
        en: What behaviour do you want from this code?
        zh-CN: 这段代码你想要什么行为？
      closing:
        en: The approval demo is over.
        zh-CN: 审批流程演示结束。
    ask:
      closing:
        en: The question could not be delivered, so I am continuing with the default behaviour.
        zh-CN: 提问没能送达，我按默认行为继续。
    tools:
      closing:
        en: The tool loop works end to end.
        zh-CN: 工具循环跑通了。
    todo:
      items:
        spec:
          en: Read the tool contract in SPEC
          zh-CN: 读 SPEC 的工具契约
        implement:
          en: Implement todo_write
          zh-CN: 实现 todo_write
        verify:
          en: Run the tests and the TUI acceptance pass
          zh-CN: 跑测试与 TUI 验收
      closing:
        en: The todo list is updated.
        zh-CN: 待办清单已更新。
    schedule:
      prompt:
        en: Write the daily report
        zh-CN: 写日报
      closing:
        en: The scheduled task is registered.
        zh-CN: 定时任务已登记。
    subagent:
      task:
        en: Summarise the repository layout in a subsession
        zh-CN: 在子会话里总结仓库结构
      child:
        en: "Sub-agent: the repo has three crates — core, store and cli."
        zh-CN: 子 agent：仓库有 core/store/cli 三个 crate。
      closing:
        en: The parent agent received the sub-task result.
        zh-CN: 父 agent 收到子任务结果。

# TUI（`qcode-tui`）：暂停卡片、提问控件、附件占位。
#
# 键位与斜杠命令**不翻译**（`/continue`、`[1-9]`、`[Esc]`）：它们是要用户照着按的
# 字面量，翻了就按不出来。翻的只是它们周围的说明。
tui:
  notice:
    queued:
      en: "queued (%{0} pending): starts when this turn ends"
      zh-CN: "已入队（共 %{0} 条待发）：这一轮结束后开始"
    steering_added:
      en: "steering (%{0} waiting): lands at the next step"
      zh-CN: "已插话（共 %{0} 条待落）：在下一步生效"
    image_attached:
      en: "image attached: %{0}x%{1} (%{2} KB) — sent with the next message (%{3} pending)"
      zh-CN: "已附加图片：%{0}x%{1}（%{2} KB）——随下一条消息发出（共 %{3} 条待发）"
    steering_preview:
      en: "steering: %{0}"
      zh-CN: "插话：%{0}"
    no_queued_message:
      en: "no queued message %{0} (see /queue)"
      zh-CN: "没有第 %{0} 条排队消息（见 /queue）"
    steering_item:
      en: "%{0}. %{1} (waiting for the next step)"
      zh-CN: "%{0}. %{1}（等待下一步）"
    returned_to_queue:
      en: "returned to the queue: %{0} (%{1} queued)"
      zh-CN: "已放回队列：%{0}（共 %{1} 条排队）"
    no_steering_item:
      en: "no steering item %{0} (see /steering)"
      zh-CN: "没有第 %{0} 条插话（见 /steering）"
    dropped:
      en: "dropped: %{0} (%{1} pending)"
      zh-CN: "已丢弃：%{0}（共 %{1} 条待发）"
    daemon_started:
      en: "daemon started (pid %{0}); it keeps running after you quit"
      zh-CN: "daemon 已启动（pid %{0}）；你退出后它继续跑"
    cannot_start_daemon:
      en: "cannot start the daemon: %{0}"
      zh-CN: "启动不了 daemon：%{0}"
    cannot_stop_daemon:
      en: "cannot stop the daemon: %{0}"
      zh-CN: "停不了 daemon：%{0}"
    turn_files:
      en: "turn %{0}: %{1} file(s) · %{2}"
      zh-CN: "第 %{0} 轮：%{1} 个文件 · %{2}"
    rolled_back:
      en: "rolled back to before turn %{0}: restored %{1}, removed %{2} created (turns %{3})"
      zh-CN: "已回滚到第 %{0} 轮之前：恢复 %{1} 个，删除 %{2} 个新建（轮次 %{3}）"
    no_turn:
      en: "no turn is running"
      zh-CN: 没有在跑的回合
    turn_busy:
      en: "a turn is already running"
      zh-CN: 已经有一个回合在跑
    queue_empty:
      en: "queue: empty"
      zh-CN: "队列：空"
    steering_empty:
      en: "steering: empty"
      zh-CN: "插话队列：空"
    paste_failed:
      en: "paste failed: %{0}"
      zh-CN: "粘贴失败：%{0}"
    rollback_failed:
      en: "rollback failed: %{0}"
      zh-CN: "回滚失败：%{0}"
    engine_error:
      en: "engine error: %{0}"
      zh-CN: "引擎错误：%{0}"
    daemon_already_running:
      en: "daemon already running (one per user)"
      zh-CN: "daemon 已经在跑了（一个用户一个）"
    daemon_stopped:
      en: "daemon: stopped (tasks keep their definitions)"
      zh-CN: "daemon：已停止（任务定义仍然保留）"
    daemon_was_not_running:
      en: "daemon: was not running"
      zh-CN: "daemon：本来就没有在跑"
    nothing_paused:
      en: "nothing is paused; /continue needs a turn that ran out of budget"
      zh-CN: "没有暂停的回合；`/continue` 需要有一个用完预算的回合"
    no_checkpoints:
      en: "no checkpoints yet: they are recorded when the agent writes a file"
      zh-CN: "还没有检查点：agent 写文件时才会记录"

  pause:
    commands:
      en: "  already ran: %{0}"
      zh-CN: "  已运行：%{0}"
    more_commands:
      en: " and %{0} more"
      zh-CN: " 等 %{0} 条"
    # 整行提示：三个斜杠命令之间的说明。命令本身原样。
    continue_hint:
      en: "  /continue continue (new budget window)  ·  a plain message also continues  ·  /wrap wrap up"
      zh-CN: "  /continue 继续（新预算窗口）  ·  直接发消息也继续  ·  /wrap 收尾"
  ask:
    progress:
      en: "— question %{0} of %{1} —"
      zh-CN: "— 第 %{0} 题 / 共 %{1} 题 —"
    no_options:
      en: (no options; type your answer)
      zh-CN: （无选项，直接输入回答）
    # 按键提示。键名与编号区间原样，只翻说明。
    controls:
      en: "[1-9] pick an option · comma separates several · [s] skip · [Enter] next / submit · [Esc] cancel"
      zh-CN: "[1-9] 选择选项 · 逗号分隔多选 · [s] 跳过 · [Enter] 下一题/提交 · [Esc] 取消"
  attachment:
    # 终端里图片只能显示占位文字：说清这一点，用户才不会以为渲染坏了。
    file:
      en: "[file %{0} — %{1} bytes]"
      zh-CN: "〔文件 %{0} — %{1} 字节〕"
    image:
      en: "[image %{0} — %{1}×%{2}; the terminal shows placeholder text only]"
      zh-CN: "〔图片 %{0} — %{1}×%{2}，终端只显示占位文字〕"
