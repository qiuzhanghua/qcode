[package]
name = "qcode-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "qcode_gui"
path = "src/lib.rs"
# The GPUI macro expansion overflows rustc in a lib test harness; integration
# tests live in tests/ instead (ADR-0037).
test = false

[dependencies]
qcode-core = { version = "0.5.0", path = "../qcode-core" }
qcode-ui-state = { version = "0.5.0", path = "../qcode-ui-state" }
qcode-ui-bridge = { version = "0.5.0", path = "../qcode-ui-bridge" }
qcode-kernel = { version = "0.5.0", path = "../qcode-kernel" }
qcode-tools = { version = "0.5.0", path = "../qcode-tools" }
qcode-mcp = { version = "0.5.0", path = "../qcode-mcp" }
# Spike candidate A (ADR-0037): components, virtual lists, code editor, a11y.
gpui-kit = "0.8.1"
qcode-image = { version = "0.5.0", path = "../qcode-image" }
base64.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "net"] }
tokio-util.workspace = true
time.workspace = true
serde_json.workspace = true
serde.workspace = true

[dev-dependencies]
async-trait.workspace = true
qcode-providers = { version = "0.5.0", path = "../qcode-providers" }
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.7"
