[package]
name = "qcode-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "qcode_gui"
path = "src/lib.rs"

[[bin]]
name = "qcode-gui"
path = "src/bin/placeholder.rs"

[dependencies]
qcode-core = { version = "0.1.0", path = "../qcode-core" }
qcode-ui-state = { version = "0.1.0", path = "../qcode-ui-state" }
qcode-ui-bridge = { version = "0.1.0", path = "../qcode-ui-bridge" }
# Spike candidate A (ADR-0037): components, virtual lists, code editor, a11y.
gpui-kit = "0.7.3"
qcode-image = { version = "0.1.0", path = "../qcode-image" }
base64.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time"] }
tokio-util.workspace = true
time.workspace = true
serde_json.workspace = true
