[package]
name = "qcode-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "qcode_gui"
path = "src/lib.rs"

[dependencies]
qcode-attachments = { version = "0.9.0", path = "../qcode-attachments" }
qcode-core = { version = "0.9.0", path = "../qcode-core" }
qcode-providers = { version = "0.9.0", path = "../qcode-providers" }
qcode-ui-state = { version = "0.9.0", path = "../qcode-ui-state" }
qcode-ui-bridge = { version = "0.9.0", path = "../qcode-ui-bridge" }
qcode-kernel = { version = "0.9.0", path = "../qcode-kernel" }
qcode-tools = { version = "0.9.0", path = "../qcode-tools" }
qcode-mcp = { version = "0.9.0", path = "../qcode-mcp" }
qcode-terminal = { version = "0.9.0", path = "../qcode-terminal" }
# Spike candidate A (ADR-0037): components, virtual lists, code editor, a11y.
gpui-kit = "0.9.1"
qcode-image = { version = "0.9.0", path = "../qcode-image" }
base64.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "net"] }
tokio-util.workspace = true
# Diagnostics only (ADR-0077 §D). `qc gui` runs in-process, so these events land in
# the same `logs/qc.log` the CLI writes — which is the only way a desktop user ever
# gets a diagnostic, since a `.desktop` launch shows them no terminal.
tracing.workspace = true
time.workspace = true
# DatePicker / TimeField 组件的值类型（chrono::NaiveDate / NaiveTime）。
chrono.workspace = true
serde_json.workspace = true
serde.workspace = true
# Close-to-tray: grab the native window handle to hide/restore the window.
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# Shell_NotifyIcon + ShowWindow for the tray and window hiding, plus LockFileEx
# and named pipes for single instance (ADR-0083 / ADR-0084).
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    # WNDCLASSEXW / RegisterClassExW are gated behind the Gdi feature.
    "Win32_Graphics_Gdi",
    # LockFileEx (gui.lock) and the named-pipe channel (gui activation).
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

[target.'cfg(unix)'.dependencies]
# `flock` 是 ADR-0083 §1 选定的互斥原语：进程怎么死的都由内核自动释放。
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# NSStatusItem for the tray icon and NSWindow for hiding/restoring.
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
# Not a duplicate of the [dependencies] entry above: an integration test only
# sees its own declared deps, and `tests/backend.rs` spawns a real flooding
# terminal to prove it cannot starve the scheduler's beat (ADR-0062).
qcode-terminal = { version = "0.9.0", path = "../qcode-terminal" }

[target.'cfg(target_os = "linux")'.dependencies]
# StatusNotifierItem + dbusmenu for the Linux tray (ADR-0052).
ksni = "0.3.7"
# Decode the embedded window icon into the `RgbaImage` that gpui's X11 backend
# turns into the `_NET_WM_ICON` property. Has to be this crate: gpui does not
# re-export its `image`, and the type has to be the same one it declared.
image = { version = "0.25", default-features = false, features = ["png"] }
# Decode the embedded PNG tray icons into the ARGB32 IconPixmap payload.
png = "0.18"
