[package]
name = "qcode-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "qcode_gui"
path = "src/lib.rs"
# The GPUI macro expansion overflows rustc in a lib test harness; integration
# tests live in tests/ instead (ADR-0037).
test = false

[dependencies]
qcode-core = { version = "0.6.0", path = "../qcode-core" }
qcode-ui-state = { version = "0.6.0", path = "../qcode-ui-state" }
qcode-ui-bridge = { version = "0.6.0", path = "../qcode-ui-bridge" }
qcode-kernel = { version = "0.6.0", path = "../qcode-kernel" }
qcode-tools = { version = "0.6.0", path = "../qcode-tools" }
qcode-mcp = { version = "0.6.0", path = "../qcode-mcp" }
# Spike candidate A (ADR-0037): components, virtual lists, code editor, a11y.
gpui-kit = "0.8.1"
qcode-image = { version = "0.6.0", path = "../qcode-image" }
base64.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "net"] }
tokio-util.workspace = true
time.workspace = true
serde_json.workspace = true
serde.workspace = true
# Close-to-tray: grab the native window handle to hide/restore the window.
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# Shell_NotifyIcon + ShowWindow for the tray and window hiding.
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    # WNDCLASSEXW / RegisterClassExW are gated behind the Gdi feature.
    "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# NSStatusItem for the tray icon and NSWindow for hiding/restoring.
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[dev-dependencies]
async-trait.workspace = true
qcode-providers = { version = "0.6.0", path = "../qcode-providers" }
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# StatusNotifierItem + dbusmenu for the Linux tray (ADR-0052).
ksni = "0.3.7"
# Decode the embedded PNG tray icons into the ARGB32 IconPixmap payload.
png = "0.18"
