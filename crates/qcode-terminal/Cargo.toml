[package]
name = "qcode-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Pinned: alacritty_terminal's API moves between minors (0.24 -> 0.26 changed
# signatures), the same reason rmcp and ratatui are pinned in this workspace.
# Apache-2.0, already on the deny.toml allow list.
alacritty_terminal = "=0.26.0"
# Shell detection lives here so `run_shell` can pick the same shell (ADR-0064).
qcode-shell = { version = "0.8.2", path = "../qcode-shell" }

[target.'cfg(unix)'.dependencies]
# Signalling the whole process group on close; `alacritty_terminal` only HUP's
# the direct child, which leaves whatever it forked running.
libc.workspace = true
