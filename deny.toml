# cargo-deny configuration: licenses, advisories, bans and sources.
# Run locally with `cargo deny check`; CI runs the same check.
# Reference: https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# The advisory database is cloned from GitHub by default. On networks where
# github.com is unreachable, either pre-seed the database and run
# `cargo deny --offline check`, or point db-urls at a mirror, e.g.
#   db-urls = ["https://gitcode.com/gh_mirrors/ad/advisory-db"]
# A yanked release can disappear from the registry at any time; do not ship it.
yanked = "deny"
ignore = [
    # ratatui 0.29 (pinned to match tui-textarea 0.7) still pulls the
    # unmaintained `paste` proc macro. Compile-time only, no known
    # vulnerability; revisit when ratatui/tui-textarea both move to 0.30.
    "RUSTSEC-2024-0436",
    # GUI/accesskit transitive graph (2026-10): no fixed release exists yet.
    # None are used on a request path outside the desktop dependency tree.
    "RUSTSEC-2024-0384", # instant
    "RUSTSEC-2025-0134", # rustls-pemfile
    "RUSTSEC-2026-0206", # rustybuzz
    "RUSTSEC-2026-0192", # ttf-parser
    # RUSTSEC-2026-0370..0372 — zbus 的那一组，同上。
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
    # lru 0.12.5 的两条 unsound 告警，**不可达**，且升不上去：
    # `lru` 只经 TUI 的 `ratatui 0.29` 进来，而 `ratatui` 的版本被 `tui-textarea`
    # 钉住——0.7.0（当前最新）要求 `ratatui ^0.29.0`，所以 `ratatui` 到 `0.30`
    # 要么等 `tui-textarea` 发版，要么自己替掉那个输入控件（TUI 重构，不是升级）。
    #
    # 可达性查过了：ratatui 把 `LruCache` 只当布局缓存用
    # （`src/layout/layout.rs:39`），全 crate 对它的调用只有 `get_or_insert`
    # 与 `resize`。两条告警分别在 `LruCache::pop()` 的 panic 安全性
    # 和 `IterMut` 的 Stacked Borrows 上，两个方法 ratatui 都没调。
    #
    # 一旦 `tui-textarea` 放出支持 ratatui 0.30 的版本，这两条要删掉。
    "RUSTSEC-2026-0253", # lru: LruCache::pop() 的 panic 安全性
    "RUSTSEC-2026-0002", # lru: IterMut 违反 Stacked Borrows
]

[licenses]
version = 2
# Permissive licenses only. Anything copyleft or ambiguous must be reviewed and
# added here explicitly, with the reason recorded in the commit message.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    # GUI build/transitive deps (2026-10). MPL is file-level copyleft and is
    # only used by cbindgen/dwrote during the GPUI build; 0BSD/CC0 are
    # permissive.
    "MPL-2.0",
    "0BSD",
    "CC0-1.0",
    # Unlicense (Linux tray, via ksni 0.3.7): a public-domain dedication with no
    # conditions at all — strictly more permissive than MIT, and the SPDX id is
    # detected with full confidence.
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
