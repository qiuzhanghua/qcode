[workspace]
resolver = "3"
members = [
  "crates/qcode-core",
  "crates/qcode-net",
  "crates/qcode-providers",
  "crates/qcode-tools",
  "crates/qcode-mcp",
  "crates/qcode",
  "crates/qcode-tui",
  "crates/qcode-eval",
  "crates/qcode-acp",
  "crates/qcode-ui-state",
  "crates/qcode-ui-bridge",
  "crates/qcode-gui",
  "crates/qcode-image",
  "crates/qcode-kernel",
  # Fork of xim-ctext 0.3.0; see [patch.crates-io] below and ADR-0051.
  "vendor/xim-ctext",
]

[patch.crates-io]
# The GPUI X11 backend decodes XIM preedit/commit text with
# `xim_ctext::compound_text_to_utf8(..).expect("Encoding Error")`. Upstream
# only understands UTF-8 and ISO-2022-JP, so a Chinese XIM preedit (GB 2312)
# panicked the GUI on the main thread. The fork decodes the charsets XIM
# servers actually send and never fails. See ADR-0051.
xim-ctext = { path = "vendor/xim-ctext" }

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
ulid = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
globset = "0.4"
libc = "0.2"
ignore = "0.4"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
ratatui = "=0.29.0"
# MCP SDK. Pinned: the client API is still pre-1.0 and changes between minors.
rmcp = { version = "=3.2.0", default-features = false, features = ["client", "transport-child-process"] }
