[workspace]
resolver = "3"
members = [
  "crates/qcode-core",
  "crates/qcode-net",
  "crates/qcode-providers",
  "crates/qcode-tools",
  "crates/qcode-mcp",
  "crates/qcode",
  "crates/qcode-tui",
  "crates/qcode-eval",
  "crates/qcode-acp",
  "crates/qcode-ui-state",
  "crates/qcode-ui-bridge",
  "crates/qcode-gui",
  "crates/qcode-image",
  "crates/qcode-kernel",
  "crates/qcode-attachments",
  # Terminal emulation core for the desktop GUI; see ADR-0062.
  "crates/qcode-terminal",
  # Shell detection + cwd probing shared by the terminal and `run_shell`; ADR-0064.
  "crates/qcode-shell",
  # Fork of xim-ctext 0.3.0; see [patch.crates-io] below and ADR-0051.
  "vendor/xim-ctext",
]

[patch.crates-io]
# The GPUI X11 backend decodes XIM preedit/commit text with
# `xim_ctext::compound_text_to_utf8(..).expect("Encoding Error")`. Upstream
# only understands UTF-8 and ISO-2022-JP, so a Chinese XIM preedit (GB 2312)
# panicked the GUI on the main thread. The fork decodes the charsets XIM
# servers actually send and never fails. See ADR-0051.
xim-ctext = { path = "vendor/xim-ctext" }
# The Windows VSync thread RedrawWindow-s every tracked HWND on each vsync; a
# closing window's HWND can be destroyed a tick or two before its raw handle is
# pruned, logging a spurious ERROR_INVALID_WINDOW_HANDLE to the console. The
# fork skips destroyed windows with an IsWindow guard. See
# vendor/gpui-pre-windows/README.qcode.md.
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[workspace.package]
version = "0.10.2"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
ulid = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
chrono = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
# Same major as rmcp's `http`, so `HeaderName`/`HeaderValue` unify across the
# MCP HTTP transport boundary.
http = "1"
globset = "0.4"
libc = "0.2"
ignore = "0.4"
regex = "1"
similar = "2.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Daily-rotated file logging with a stable `qc.log` symlink (ADR-0077). Chosen
# over log4rs because it plugs into `tracing` rather than the `log` facade, so
# spans survive; see the ADR for the full comparison.
tracing-appender = "0.2"
tempfile = "3"
ratatui = "=0.29.0"
# MCP SDK. Pinned to a major-minor we can read: the client API is still
# pre-1.0 and changes between minors.
#
# The pin to exactly 3.9.0 is now load-bearing, not tidiness: ADR-0067 enables
# `transport-streamable-http-client-reqwest`, which puts the HTTP client path in
# reach, and RUSTSEC-2026-0462 (unbounded response body buffering in exactly
# that path) is patched in 3.9.0 and nothing earlier. Downgrading re-opens a
# reachable DoS. The other two advisories the 3.2.0 → 3.9.0 bump was made for
# stay out of reach by feature selection: 0457 is OAuth (we never enable `auth`)
# and 0461 is the server-side HTTP transport (never enabled either).
rmcp = { version = "=3.9.0", default-features = false, features = [
  "client",
  "transport-child-process",
  # Streamable HTTP client. The `reqwest` feature is separate and needed too:
  # `transport-streamable-http-client-reqwest` only enables the optional
  # dependency, while `reqwest` adds `reqwest?/rustls`. Without it the transport
  # would have no TLS backend.
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }

# 发布体积。GUI 版（`--features gui`）把整个 GPU 栈静态链进来，不加这几项时
# 本机构建是 88 MB，其中 20 MB 是 `.symtab` 里的 18.5 万个符号名。
#
# 实测（同一台 Linux amd64，干净的 target 目录）：
#   默认                 88 MB
#   仅 strip             66 MB
#   thin + cgu=1 + strip 55 MB   ← 这里采用，构建 2m30s
#   fat  + cgu=1 + strip 46 MB   （构建 5m30s，多 3 分钟只再省 9 MB，不值）
#
# `codegen-units = 1` 是 LTO 发挥作用的前提：多个 CGU 下 LTO 只能跨 CGU 合并有限
# 范围。它也让优化机会变多，release 的跑分通常略有提升，代价是编译变慢。
#
# `strip = "symbols"` 只去掉符号表，`.debug_*` 本来就没生成（debug=0），所以崩溃
# 时的 backtrace 本来就只有地址。要可读的栈就另外留一份未 strip 的产物，别为此
# 放弃 20 MB。
#
# 有意不设 `panic = "abort"`：还能再省 7 MB（48 MB），但任何线程 panic 会直接
# 终止进程，而不是像现在这样被 tokio / GPUI 捕获后只挂掉那个任务。桌面 GUI 里
# 这个取舍要想清楚再动；加了之后 `cargo test` 仍按 unwind 跑（test profile 独立）。
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
