name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    # A step that hangs must fail, not sit there until someone notices. There was
    # no timeout here until a macOS test blocked on a GUI approval prompt nobody
    # could answer: the job ran for four hours, was cancelled by hand, and CI
    # stayed red for two days because the run never *failed* — it never finished.
    # Budgets are ~3-4x the slowest observed run (macos 7m, ubuntu 6m, windows 12m,
    # msrv 1.2m, deny 0.9m).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The GUI links against system libraries through pkg-config (README
      # "Linux 构建依赖"). The runner image ships the runtime packages but not
      # the `-dev` ones, so `yeslogic-fontconfig-sys` dies in its build script
      # with "Package 'fontconfig' not found" before clippy ever runs. That is
      # why this job failed with exit 101 and no clippy diagnostics at all.
      - name: linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev
      - run: cargo fmt --all --check
      - name: macOS guard type-check (apple libc shim)
        # Cheap and Linux-only on purpose: `test (macos-latest)` is the real
        # coverage, but a `#[cfg(target_os = "macos")]` module gets no compiler
        # on the other runners, and this both checks the code and self-checks
        # that the script still extracts the right slice of it. See ADR-0074.
        if: runner.os == 'Linux'
        run: bash scripts/check-macos-guard.sh
      - name: clippy
        shell: bash
        run: bash scripts/ci-clippy.sh
      - name: test
        shell: bash
        run: bash scripts/ci-test.sh
      - name: fixture self-check
        run: bash eval/fixtures/workspace/scripts/ci.sh
      - name: linux sandbox tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # The filters need the `tests::` segment: the modules live in
          # `sandbox::tests::{linux_tests, landlock_runtime}`, so the shorter
          # paths matched nothing and both lines passed with "0 passed; 89
          # filtered out" — a green step that tested no sandbox assertion.
          cargo test -p qcode-tools --lib sandbox::tests::linux_tests -- --nocapture
          cargo test -p qcode-tools --lib sandbox::tests::landlock_runtime -- --nocapture
      # ADR-0051: the GUI's XIM client decodes preedit text with
      # `xim_ctext::..expect("Encoding Error")`, which panics on the GB 2312
      # COMPOUND_TEXT every Chinese IME sends. `vendor/xim-ctext` fixes it via
      # [patch.crates-io]; a GPUI/zed-xim bump could silently drop the patch.
      - name: xim-ctext patch is in effect
        if: runner.os == 'Linux'
        run: |
          cargo tree -e normal -p qcode-gui -i xim-ctext | tee /tmp/xim-tree.txt
          grep -q 'vendor/xim-ctext' /tmp/xim-tree.txt
      # ADR-0095. This is the gate for the code no runner here compiles natively:
      # the two darwin triples. Until now they were covered only by
      # `test (macos-latest)` and `build (macos-26, …)`, i.e. by a job that may
      # queue for minutes and whose failure arrives long after the push. On this
      # runner the check is four minutes and fails the push.
      #
      # What it does **not** cover, and cannot: `qcode-gui` and `qcode`, because
      # `gpui-pre-apple`'s build script is `#[cfg(any(target_os = "macos",
      # target_os = "ios"))] fn main()` — a build script compiles for the *host*,
      # so on Linux main is empty and the Apple-only `include_str!` of the
      # generated Metal shader fails. The script prints that exclusion instead of
      # quietly testing 15 of 17 crates; `test (macos-latest)` still owns the rest.
      #
      # The Windows triples in the script's list stay listed and stay unchecked:
      # their C dependency needs llvm-mingw, which is a large toolchain to add
      # here, and `windows-build` compiles those `#[cfg(windows)]` files natively.
      # The script says so rather than skipping in silence.
      - name: cache zig (.toolchains)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .toolchains
          # Keyed on the version `scripts/install-zig.sh` pins, so bumping it
          # invalidates the cache instead of silently reusing the old binary.
          key: zig-0.17.0-${{ runner.os }}
      - name: cross-target type-check (windows + darwin, ADR-0095)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # 0.17.0 is what `scripts/install-zig.sh` pins. Zig carries the macOS C
          # SDK, which is the only way a Linux host compiles `libsqlite3-sys` and
          # `aws-lc-sys` for a darwin triple.
          zig_dir=$(bash scripts/install-zig.sh)
          echo "zig: $zig_dir"
          # The darwin std is what used to make this whole check report
          # "not checked (target std not installed)" and pass without testing
          # anything.
          rustup target add \
            aarch64-apple-darwin x86_64-apple-darwin \
            aarch64-pc-windows-gnullvm x86_64-pc-windows-gnullvm
          export PATH="$zig_dir:$PATH"
          # A writable cache: the runner's ~/.cache is fine, but being explicit
          # keeps this identical to what a developer runs locally.
          export ZIG_GLOBAL_CACHE_DIR="${RUNNER_TEMP:-/tmp}/zig-cache"
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR"
          bash scripts/ci-cross-check.sh

  windows-build:
    name: windows (build + smoke)
    # Same reasoning as the `test` job: see the note there.
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Full runtime tests still need the PowerShell/cmd shell work; this job
      # catches compile/link regressions before that lands.
      - name: clippy
        shell: bash
        run: bash scripts/ci-clippy.sh
      # `--all-targets` in clippy above type-checks every binary, example and
      # test, and this line links the test binaries — together they compile
      # every `#[cfg(windows)]` file in the workspace,
      # `crates/qcode/tests/sandbox_roots.rs` included, natively and with
      # MSVC's C toolchain in place.
      #
      # The `test` job also runs `scripts/ci-cross-check.sh`, but that does not
      # cover the Windows triples: their C dependency needs llvm-mingw and a
      # stock ubuntu runner has no `<triple>-clang`. It covers the **darwin**
      # triples (ADR-0095), which no runner here compiles natively. This job
      # remains the only native check of the `#[cfg(windows)]` code.
      - run: cargo test --workspace --no-run
      # 这条断言曾经是反的：ADR-0038 那会儿默认构建必须**不含** GPU 栈（瘦身版 CLI，
      # 窗口另出一个 qcode-desktop）。ADR-0086 把两个产物合成一个之后，默认构建
      # **应该**带 gpui——于是这条断言必须反过来查，否则每次 CI 都会报一个假的
      # “违规”。留着它（而不是删掉）的价值在于：它现在是「有人把窗口又拆出去」
      # 的探针，而那种回退正是 ADR-0086 要防的。
      - name: default build carries the window (ADR-0086)
        shell: pwsh
        run: |
          $tree = cargo tree -p qcode --offline
          if (-not ($tree | Select-String -Pattern 'gpui')) {
            throw "the default qc build must carry gpui — one binary, window included (ADR-0086)"
          }
          Write-Host "ok: gpui is in the default tree (one binary, ADR-0086)"

      - name: mock smoke
        run: cargo run -p qcode -- run "hi" --provider mock --json --data-dir .tmp/windows-data

  msrv:
    name: msrv (1.95)
    # Same reasoning as the `test` job: see the note there.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      # Same pkg-config set as the `test` job: `cargo check --workspace` covers
      # qcode-gui, whose fontconfig build script fails without the -dev package.
      - name: linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev
      - run: cargo check --workspace

  deny:
    name: cargo-deny (licenses, advisories, sources)
    # Same reasoning as the `test` job: see the note there.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
