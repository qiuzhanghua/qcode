name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The GUI links against system libraries through pkg-config (README
      # "Linux 构建依赖"). The runner image ships the runtime packages but not
      # the `-dev` ones, so `yeslogic-fontconfig-sys` dies in its build script
      # with "Package 'fontconfig' not found" before clippy ever runs. That is
      # why this job failed with exit 101 and no clippy diagnostics at all.
      - name: linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev
      - run: cargo fmt --all --check
      - name: macOS guard type-check (apple libc shim)
        # Cheap and Linux-only on purpose: `test (macos-latest)` is the real
        # coverage, but a `#[cfg(target_os = "macos")]` module gets no compiler
        # on the other runners, and this both checks the code and self-checks
        # that the script still extracts the right slice of it. See ADR-0074.
        if: runner.os == 'Linux'
        run: bash scripts/check-macos-guard.sh
      - name: clippy
        shell: bash
        run: bash scripts/ci-clippy.sh
      - name: test
        shell: bash
        run: bash scripts/ci-test.sh
      - name: fixture self-check
        run: bash eval/fixtures/workspace/scripts/ci.sh
      - name: linux sandbox tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # The filters need the `tests::` segment: the modules live in
          # `sandbox::tests::{linux_tests, landlock_runtime}`, so the shorter
          # paths matched nothing and both lines passed with "0 passed; 89
          # filtered out" — a green step that tested no sandbox assertion.
          cargo test -p qcode-tools --lib sandbox::tests::linux_tests -- --nocapture
          cargo test -p qcode-tools --lib sandbox::tests::landlock_runtime -- --nocapture
      # ADR-0051: the GUI's XIM client decodes preedit text with
      # `xim_ctext::..expect("Encoding Error")`, which panics on the GB 2312
      # COMPOUND_TEXT every Chinese IME sends. `vendor/xim-ctext` fixes it via
      # [patch.crates-io]; a GPUI/zed-xim bump could silently drop the patch.
      - name: xim-ctext patch is in effect
        if: runner.os == 'Linux'
        run: |
          cargo tree -e normal -p qcode-gui -i xim-ctext | tee /tmp/xim-tree.txt
          grep -q 'vendor/xim-ctext' /tmp/xim-tree.txt

  cross-check:
    # Type-check the platform-gated code from one Linux runner.
    #
    # This does not replace `test (macos-latest)` or `windows-build`; both still
    # compile the real backends on the real OS. What it adds is *when* the
    # failure shows up: the triples below are the ones `build-for-release`
    # ships, and `cargo check` needs no linker, so a signature change that only
    # breaks `#[cfg(windows)]` code fails here in seconds instead of after a
    # Windows runner queues. Added after exactly that happened — a new parameter
    # on `Sandbox::with_roots` broke `crates/qcode/tests/sandbox_roots.rs`
    # (`#![cfg(windows)]`) and `cargo test --workspace` on Linux stayed green.
    #
    # There are no `cfg(target_env)` / `cfg(target_vendor)` gates in this
    # workspace, which is why `windows-gnullvm` stands in for the msvc build
    # without loss. If one is ever added, this job must grow the msvc triple.
    #
    # Windows only, on purpose. The darwin triples are in the script and in the
    # Makefile target, but *not* here: checking them from Linux means compiling
    # Apple-framework C shims that have never been tried from this runner, and a
    # job added on a guess is a job that goes red for reasons unrelated to the
    # change. `test (macos-latest)` already compiles the macOS backend on macOS,
    # which is the real coverage; this job only adds speed for the Windows half.
    name: cross-check (windows cfg gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnullvm
      - uses: Swatinem/rust-cache@v2
      # Same pkg-config set as `test`: `--workspace` reaches qcode-gui, whose
      # fontconfig build script is a *host* build script and still runs.
      - name: linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev
      - name: cargo check for the shipping triples
        shell: bash
        # x86_64 only. The first run of this job failed on aarch64 with
        # `cc-rs: failed to find tool "aarch64-w64-mingw32-clang"` — a C build
        # script needs the llvm-mingw cross toolchain, which exists in the
        # release environment (`build-for-release` requires it for the windows
        # targets) but not on a stock ubuntu runner.
        #
        # Dropping it costs no coverage: there are no `cfg(target_arch)` gates
        # anywhere in this workspace (verified with a grep), so all Windows
        # cfg-gated code is compiled either way. The aarch64 triple stays in
        # the script's default list for machines that do have the toolchain —
        # here, name only what this runner can actually build.
        run: bash scripts/ci-cross-check.sh x86_64-pc-windows-gnullvm

  windows-build:
    name: windows (build + smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Full runtime tests still need the PowerShell/cmd shell work; this job
      # catches compile/link regressions before that lands.
      - name: clippy
        shell: bash
        run: bash scripts/ci-clippy.sh
      - run: cargo test --workspace --no-run
      - name: default build carries no GPU stack
        shell: pwsh
        run: |
          $tree = cargo tree -p qcode --offline
          if ($tree | Select-String -Pattern 'gpui') {
            throw "the default qc build must not pull gpui (ADR-0038)"
          }
          Write-Host "ok: no gpui in the default tree"

      - name: mock smoke
        run: cargo run -p qcode -- run "hi" --provider mock --json --data-dir .tmp/windows-data

  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      # Same pkg-config set as the `test` job: `cargo check --workspace` covers
      # qcode-gui, whose fontconfig build script fails without the -dev package.
      - name: linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev
      - run: cargo check --workspace

  deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
