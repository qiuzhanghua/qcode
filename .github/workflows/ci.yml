name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: clippy
        shell: bash
        run: bash scripts/ci-clippy.sh
      - name: test
        shell: bash
        run: bash scripts/ci-test.sh
      - name: fixture self-check
        run: bash eval/fixtures/workspace/scripts/ci.sh
      - name: linux sandbox tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          cargo test -p qcode-tools --lib sandbox::linux_tests -- --nocapture
          cargo test -p qcode-tools --lib sandbox::landlock_runtime -- --nocapture

  windows-build:
    name: windows (build + smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Full runtime tests still need the PowerShell/cmd shell work; this job
      # catches compile/link regressions before that lands.
      - name: clippy
        shell: bash
        run: bash scripts/ci-clippy.sh
      - run: cargo test --workspace --no-run
      - name: default build carries no GPU stack
        shell: pwsh
        run: |
          $tree = cargo tree -p qcode --offline
          if ($tree | Select-String -Pattern 'gpui') {
            throw "the default qc build must not pull gpui (ADR-0038)"
          }
          Write-Host "ok: no gpui in the default tree"

      - name: mock smoke
        run: cargo run -p qcode -- run "hi" --provider mock --json --data-dir .tmp/windows-data

  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
